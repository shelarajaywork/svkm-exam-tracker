      userEmail: currentUser.email,
      dateValue: dateVal || "",
      details: dateVal ? "Marked activity as performed" : "Cleared performed date",
      timestamp: new Date().toISOString()
    };
    onUpdateLog(act.id, {
      ...cur,
      performedDate: dateVal,
      performedByUser: dateVal ? {
        name: currentUser.name,
        email: currentUser.email,
        timestamp: new Date().toISOString()
      } : null,
      history: [...(cur.history || []), hist]
    });
  };

  const handleUpdateField = (actId, field, val) => {
    const cur = currentLogs[actId] || {};
    let nextHistory = cur.history || [];
    if (field === 'isNA') {
      nextHistory = [...nextHistory, {
        id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        action: val ? "MARKED_NA" : "MARKED_APPLICABLE",
        role: currentUser.role,
        userName: currentUser.name,
        userEmail: currentUser.email,
        dateValue: "",
        details: val ? "Marked as Not Applicable (N/A)" : "Marked as Applicable",
        timestamp: new Date().toISOString()
      }];
    }
    onUpdateLog(actId, {
      ...cur,
      [field]: val,
      history: nextHistory
    });
  };

  // Verifier action
  const handleVerify = (act, role, customDate) => {
    const cur = currentLogs[act.id] || {};
    const dateVal = customDate || getTodayYYYYMMDD();
    const hist = {
      id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      action: "VERIFIED",
      role: currentUser.role,
      userName: currentUser.name,
      userEmail: currentUser.email,
      dateValue: dateVal,
      details: `Signed off verification tier ${role}`,
      timestamp: new Date().toISOString()
    };
    onUpdateLog(act.id, {
      ...cur,
      verifications: {
        ...(cur.verifications || {}),
        [role]: {
          verified: true,
          date: dateVal,
          userName: currentUser.name,
          userEmail: currentUser.email,
          systemTimestamp: new Date().toISOString()
        }
      },
      history: [...(cur.history || []), hist]
    });
  };

  const handleUnverify = (act, role) => {
    showConfirm({
      title: "Revoke Verification",
      message: `Are you sure you want to revoke verification for tier ${role}? This action will be recorded in the audit trail.`,
      confirmText: "Revoke",
      cancelText: "Cancel",
      type: "danger",
      onConfirm: () => {
        const cur = currentLogs[act.id] || {};
        const prevVerif = cur.verifications?.[role] || {};
        const hist = {
          id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          action: "VERIFICATION_REVOKED",
          role: currentUser.role,
          userName: currentUser.name,
          userEmail: currentUser.email,
          dateValue: prevVerif.date || "",
          details: `Revoked verification tier ${role} previously signed off by ${prevVerif.userName || role} on ${formatDateDisplay(prevVerif.date)}`,
          timestamp: new Date().toISOString()
        };
        const nextHistory = [...(cur.history || []), hist];
        if (onRevokeVerification) {
          onRevokeVerification(act.id, role, nextHistory);
        } else {
          const nextVerifs = { ...(cur.verifications || {}) };
          delete nextVerifs[role];
          onUpdateLog(act.id, {
            ...cur,
            verifications: nextVerifs,
            history: nextHistory
          });
        }
      }
    });
  };

  return (
    <div className="max-w-[1700px] mx-auto px-4 py-3 space-y-3 pb-24">
      
      {/* Filters & KPI Bar */}
      <div className="bg-white dark:bg-slate-900 rounded-2xl p-3 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-wrap items-center justify-between gap-3 text-xs no-print">
        
        {/* Left: Dropdowns & Search */}
        <div className="flex flex-wrap items-center gap-2.5">
          {/* Phase Filter */}
          <div className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800 px-2 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
            <span className="font-semibold text-slate-500">Phase:</span>
            <select
              value={phaseFilter}
              onChange={(e) => setPhaseFilter(e.target.value)}
              className="bg-transparent font-bold text-slate-900 dark:text-white focus:outline-none cursor-pointer max-w-[200px] truncate"
            >
              <option value="ALL" className="dark:bg-slate-900">All 7 Phases</option>
              {phases.map(p => (
                <option key={p} value={p} className="dark:bg-slate-900">{p}</option>
              ))}
            </select>
          </div>

          {/* Status Filter */}
          <div className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800 px-2 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
            <span className="font-semibold text-slate-500">Status:</span>
            <select
              value={statusFilter}
              onChange={(e) => setStatusFilter(e.target.value)}
              className="bg-transparent font-bold text-slate-900 dark:text-white focus:outline-none cursor-pointer"
            >
              <option value="ALL" className="dark:bg-slate-900">All Statuses</option>
              <option value="AWAITING_ME" className="dark:bg-slate-900">⚡ Awaiting My Action</option>
              <option value="PENDING" className="dark:bg-slate-900">Pending</option>
              <option value="IN_PROGRESS" className="dark:bg-slate-900">In Progress</option>
              <option value="COMPLETED" className="dark:bg-slate-900">Completed (Verified)</option>
              <option value="QUERY_RAISED" className="dark:bg-slate-900">Query Raised</option>
              <option value="NA" className="dark:bg-slate-900">N/A (Not Applicable)</option>
            </select>
          </div>

          {/* Performer / Maker Filter */}
          <div className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800 px-2 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700">
            <span className="font-semibold text-slate-500">Maker:</span>
            <select
              value={makerFilter}
              onChange={(e) => setMakerFilter(e.target.value)}
              className="bg-transparent font-bold text-slate-900 dark:text-white focus:outline-none cursor-pointer"
            >
              <option value="ALL" className="dark:bg-slate-900">All Roles</option>
              <option value="ASST" className="dark:bg-slate-900">ASST (Assistant)</option>
              <option value="ASST_COORD" className="dark:bg-slate-900">ASST_COORD (Asst. Coord)</option>
              <option value="COORD" className="dark:bg-slate-900">COORD (Coordinator)</option>
              <option value="AR" className="dark:bg-slate-900">AR (Asst. Registrar)</option>
            </select>
          </div>

          {/* Search Input */}
          <div className="relative">
            <input
              type="text"
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              placeholder="Search activity name or #..."
              className="w-52 pl-8 pr-3 py-1.5 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white"
            />
            <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-slate-400">
              <Icon name="search" size={14} />
            </div>
            {searchQuery && (
              <button
                onClick={() => setSearchQuery("")}
                className="absolute inset-y-0 right-0 pr-2 flex items-center text-slate-400 hover:text-slate-600"
              >
                <Icon name="x" size={12} />
              </button>
            )}
          </div>
        </div>

        {/* Right: Progress & Stats */}
        <div className="flex items-center gap-3">
          <div className="flex items-center gap-2">
            <div className="text-right">
              <div className="font-bold text-slate-900 dark:text-white text-xs">
                {stats.completed} / {activities.length - stats.na} Done ({stats.pct}%)
              </div>
              <div className="text-[10px] text-slate-400">
                {stats.queryRaised > 0 && <span className="text-red-500 font-bold mr-1">⚠️ {stats.queryRaised} Queries</span>}
                {stats.inProgress} in progress • {stats.pending} pending
              </div>
            </div>
            <div className="w-16 h-2 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
              <div
                className="h-full bg-emerald-500 rounded-full transition-all duration-500"
                style={{ width: `${stats.pct}%` }}
              />
            </div>
          </div>

          <div className="flex items-center gap-1 border-l border-slate-200 dark:border-slate-800 pl-2">
            <button
              onClick={expandAll}
              className="px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 text-[11px] text-slate-600 dark:text-slate-300 hover:bg-slate-200"
              title="Expand all phases"
            >
              Expand All
            </button>
            <button
              onClick={collapseAll}
              className="px-2 py-1 rounded bg-slate-100 dark:bg-slate-800 text-[11px] text-slate-600 dark:text-slate-300 hover:bg-slate-200"
              title="Collapse all phases"
            >
              Collapse
            </button>
            <button
              onClick={() => exportCurrentViewExcel(filteredActivities, currentLogs, context, headerMetrics)}
              className="flex items-center gap-1 px-2.5 py-1 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:hover:bg-emerald-900/80 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 font-semibold transition"
              title="Export Current View to Excel (.xlsx)"
            >
              <Icon name="download" size={13} />
              <span>Export Excel</span>
            </button>
          </div>
        </div>
      </div>

      {/* Activities Grouped By Phase */}
      <div className="space-y-4">
        {phases.map(phaseName => {
          const phaseActs = filteredActivities.filter(a => a.phase === phaseName);
          if (phaseActs.length === 0) return null;

          const isCollapsed = !!collapsedPhases[phaseName];
          const phaseTotal = phaseActs.length;
          const phaseDone = phaseActs.filter(a => computeActivityStatus(a, currentLogs[a.id], context.semester) === "COMPLETED").length;
          const phasePct = phaseTotal > 0 ? Math.round((phaseDone / phaseTotal) * 100) : 0;

          return (
            <div
              key={phaseName}
              className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden transition"
            >
              {/* Collapsible Phase Header */}
              <div
                onClick={() => togglePhase(phaseName)}
                className="px-4 py-3 bg-slate-50/80 dark:bg-slate-800/50 hover:bg-slate-100/80 dark:hover:bg-slate-800/80 cursor-pointer flex items-center justify-between gap-3 border-b border-slate-200/80 dark:border-slate-800 transition select-none"
              >
                <div className="flex items-center gap-3">
                  <Icon
                    name={isCollapsed ? "chevron-right" : "chevron-down"}
                    size={16}
                    className="text-slate-400 transition"
                  />
                  <div>
                    <h2 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                      <span>{phaseName}</span>
                      <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300">
                        {phaseDone} / {phaseTotal} Completed ({phasePct}%)
                      </span>
                    </h2>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <div className="w-24 h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden hidden sm:block">
                    <div
                      className="h-full bg-indigo-600 rounded-full transition-all"
                      style={{ width: `${phasePct}%` }}
                    />
                  </div>
                  <span className="text-xs text-slate-400 font-mono">
                    {isCollapsed ? "Click to view rows" : "Hide rows"}
                  </span>
                </div>
              </div>

              {/* Table */}
              {!isCollapsed && (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-semibold border-b border-slate-200 dark:border-slate-700 uppercase tracking-wider text-[10px]">
                        <th className="py-2.5 px-3 w-8 text-center">
                          <input
                            type="checkbox"
                            onChange={handleSelectAllVisible}
                            checked={selectedIds.length > 0 && selectedIds.length === filteredActivities.length}
                            className="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                          />
                        </th>
                        <th className="py-2.5 px-2 w-12 text-center">#</th>
                        <th className="py-2.5 px-3 min-w-[280px]">Activity Name & Phase</th>
                        <th className="py-2.5 px-2 w-20 text-center">Maker</th>
                        <th className="py-2.5 px-2 w-14 text-center">N/A</th>
                        <th className="py-2.5 px-3 min-w-[190px]">Performed Date & Value</th>
                        <th className="py-2.5 px-2 min-w-[110px] text-center bg-indigo-50/40 dark:bg-indigo-950/20">ASST_COORD</th>
                        <th className="py-2.5 px-2 min-w-[110px] text-center bg-purple-50/40 dark:bg-purple-950/20">COORD</th>
                        <th className="py-2.5 px-2 min-w-[110px] text-center bg-amber-50/40 dark:bg-amber-950/20">AR</th>
                        <th className="py-2.5 px-2 min-w-[110px] text-center bg-blue-50/40 dark:bg-blue-950/20">DY_COE</th>
                        <th className="py-2.5 px-2 min-w-[110px] text-center bg-emerald-50/40 dark:bg-emerald-950/20">COE</th>
                        <th className="py-2.5 px-3 w-28 text-center">Status</th>
                        <th className="py-2.5 px-2 w-20 text-center">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800/60">
                      {phaseActs.map(act => {
                        const log = currentLogs[act.id] || {};
                        const status = computeActivityStatus(act, log, context.semester);
                        const isSelected = selectedIds.includes(act.id);
                        const isQuery = status === "QUERY_RAISED";
                        const isNA = !!log.isNA;
                        const isSkipped = status === "SKIPPED";
                        const isCurrentUserMaker = currentUser.isAdmin || currentUser.role === act.performedBy;

                        // Row background styling
                        let rowBg = "hover:bg-slate-50/80 dark:hover:bg-slate-800/40";
                        if (isQuery) rowBg = "bg-rose-50/70 dark:bg-rose-950/30 hover:bg-rose-100/70";
                        else if (status === "COMPLETED") rowBg = "bg-emerald-50/30 dark:bg-emerald-950/10 hover:bg-emerald-50/60";
                        else if (isNA || isSkipped) rowBg = "opacity-60 bg-slate-50/50 dark:bg-slate-900/50";

                        return (
                          <tr key={act.id} className={`${rowBg} transition`}>
                            {/* Checkbox */}
                            <td className="py-2 px-3 text-center">
                              <input
                                type="checkbox"
                                checked={isSelected}
                                onChange={() => toggleSelectRow(act.id)}
                                className="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                              />
                            </td>

                            {/* Sr No */}
                            <td className="py-2 px-2 text-center font-mono text-slate-500 font-bold">
                              {act.srNo}
                            </td>

                            {/* Name & Badges */}
                            <td className="py-2 px-3">
                              <div className="font-semibold text-slate-900 dark:text-white leading-snug">
                                {act.name}
                              </div>
                              <div className="flex flex-wrap items-center gap-1.5 mt-1">
                                {act.cond !== "ALL" && (
                                  <span className="px-1.5 py-0.2 rounded text-[10px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-300">
                                    {act.cond === "EVEN_ONLY" ? "Even Sem Only" : "Final Sem Only"}
                                  </span>
                                )}
                                {isSkipped && (
                                  <span className="px-1.5 py-0.2 rounded text-[10px] font-bold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300">
                                    Skipped in {context.semester}
                                  </span>
                                )}
                                {isQuery && (
                                  <span className="px-1.5 py-0.2 rounded text-[10px] font-bold bg-rose-600 text-white flex items-center gap-1 animate-pulse">
                                    <Icon name="alert-triangle" size={10} />
                                    Query Active
                                  </span>
                                )}
                              </div>
                            </td>

                            {/* Maker Role */}
                            <td className="py-2 px-2 text-center">
                              <span className={`px-2 py-0.5 rounded-lg text-[10px] font-bold ${
                                act.performedBy === 'ASST' ? 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300' :
                                act.performedBy === 'ASST_COORD' ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300' :
                                act.performedBy === 'COORD' ? 'bg-purple-100 text-purple-700 dark:bg-purple-900/60 dark:text-purple-300' :
                                'bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-300'
                              }`}>
                                {act.performedBy}
                              </span>
                            </td>

                            {/* N/A Toggle */}
                            <td className="py-2 px-2 text-center">
                              <button
                                type="button"
                                onClick={() => handleUpdateField(act.id, 'isNA', !isNA)}
                                className={`px-2 py-0.5 rounded text-[10px] font-bold transition ${
                                  isNA
                                    ? 'bg-slate-600 text-white'
                                    : 'bg-slate-100 dark:bg-slate-800 text-slate-400 hover:text-slate-700'
                                }`}
                                title={isNA ? "Mark as Applicable" : "Mark as Not Applicable (N/A)"}
                              >
                                {isNA ? "N/A" : "App"}
                              </button>
                            </td>

                            {/* Performed Date & Input */}
                            <td className="py-2 px-3">
                              {isNA ? (
                                <span className="text-slate-400 italic text-[11px]">Not Applicable</span>
                              ) : isSkipped ? (
                                <span className="text-slate-400 italic text-[11px]">Condition Not Met</span>
                              ) : (
                                <div className="space-y-1">
                                  <div className="flex items-center gap-1.5">
                                    <input
                                      type="date"
                                      disabled={!isCurrentUserMaker}
                                      value={log.performedDate || ""}
                                      onChange={(e) => handleSetPerformedDate(act, e.target.value)}
                                      className={`px-2 py-1 text-xs rounded-lg border focus:ring-1 focus:ring-indigo-500 font-mono text-slate-900 dark:text-white ${
                                        !isCurrentUserMaker
                                          ? 'bg-slate-100 dark:bg-slate-800/40 border-slate-200 dark:border-slate-800 cursor-not-allowed text-slate-500'
                                          : 'bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-700'
                                      }`}
                                    />
                                    {isCurrentUserMaker && (
                                      <button
                                        type="button"
                                        onClick={() => handleSetPerformedDate(act, getTodayYYYYMMDD())}
                                        className="px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 dark:bg-indigo-950/60 dark:hover:bg-indigo-900 dark:text-indigo-300 rounded-lg text-[10px] font-bold border border-indigo-200 dark:border-indigo-800 transition"
                                        title="Set Performed Date to Today"
                                      >
                                        Today
                                      </button>
                                    )}
                                  </div>

                                  {/* Value / Remarks Row */}
                                  <div className="flex flex-wrap items-center gap-1 text-[11px] mt-1">
                                    <input
                                      type="text"
                                      disabled={!isCurrentUserMaker}
                                      value={log.metricValue || ""}
                                      onChange={(e) => handleUpdateField(act.id, 'metricValue', e.target.value)}
                                      placeholder="Value / Timing (opt)..."
                                      className="w-24 px-1.5 py-0.5 rounded bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-[10px]"
                                    />
                                    <input
                                      type="text"
                                      value={log.remarks || ""}
                                      onChange={(e) => handleUpdateField(act.id, 'remarks', e.target.value)}
                                      placeholder="Remarks (opt)..."
                                      className="w-28 px-1.5 py-0.5 rounded bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-[10px]"
                                      title="Remarks (exported to Excel)"
                                    />
                                    {log.performedByUser && (
                                      <span className="text-[10px] text-slate-400 truncate max-w-[80px]" title={`By ${log.performedByUser.name}`}>
                                        by {log.performedByUser.name.split(' ')[0]}
                                      </span>
                                    )}
                                  </div>
                                </div>
                              )}
                            </td>

                            {/* Dynamic Verification Columns */}
                            {['ASST_COORD', 'COORD', 'AR', 'DY_COE', 'COE'].map(role => {
                              // Is maker this role or higher?
                              const makerRank = ROLE_RANKS[act.performedBy];
                              const colRank = ROLE_RANKS[role];
                              const reqs = (act.requiredVerifiers || []).filter(r => (ROLE_RANKS[r] ?? -1) > (ROLE_RANKS[act.performedBy] ?? -1));
                              const isRequired = reqs.includes(role);

                              if (colRank <= makerRank) {
                                return (
                                  <td key={role} className="py-2 px-2 text-center text-[10px] text-slate-400 italic">
                                    — (Maker)
                                  </td>
                                );
                              }

                              if (!isRequired) {
                                return (
                                  <td key={role} className="py-2 px-2 text-center text-[10px] text-slate-300 dark:text-slate-700 italic">
                                    — (Not Req)
                                  </td>
                                );
                              }

                              // Is verified?
                              const verif = log.verifications?.[role];
                              if (verif && verif.verified) {
                                const canRevoke = currentUser.isAdmin || currentUser.role === role;
                                return (
                                  <td key={role} className="py-2 px-2 text-center">
                                    <div className="group relative inline-block">
                                      <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800 shadow-sm cursor-help">
                                        <Icon name="check" size={11} className="text-emerald-600 dark:text-emerald-400" />
                                        <span>{formatDateDisplay(verif.date)}</span>
                                      </span>
                                      
                                      {/* Tooltip / Revoke on hover */}
                                      <div className="hidden group-hover:block absolute bottom-full left-1/2 -translate-x-1/2 mb-1.5 p-2 bg-slate-900 text-white text-[10px] rounded-xl shadow-xl border border-slate-700 whitespace-nowrap z-20">
                                        <div className="font-bold">Verified by {verif.userName}</div>
                                        <div className="text-slate-400">{verif.userEmail}</div>
                                        {canRevoke && (
                                          <button
                                            type="button"
                                            onClick={() => handleUnverify(act, role)}
                                            className="mt-1.5 px-2 py-0.5 bg-red-600 hover:bg-red-700 text-white rounded font-bold text-[9px] block w-full text-center"
                                          >
                                            Revoke Verification
                                          </button>
                                        )}
                                      </div>
                                    </div>
                                  </td>
                                );
                              }

                              // Awaiting maker?
                              if (!log.performedDate) {
                                return (
                                  <td key={role} className="py-2 px-2 text-center text-[10px] text-slate-400 italic">
                                    Awaiting Maker
                                  </td>
                                );
                              }

                              // Check previous required tier in sanitized chain
                              const roleIndex = reqs.indexOf(role);
                              const prevRole = roleIndex > 0 ? reqs[roleIndex - 1] : null;
                              const isPrevDone = !prevRole || !!log.verifications?.[prevRole]?.verified;

                              if (!isPrevDone) {
                                return (
                                  <td key={role} className="py-2 px-2 text-center text-[10px] text-slate-400 italic">
                                    Awaiting {prevRole}
                                  </td>
                                );
                              }

                              // Ready for verification! Does current user match role or admin?
                              const canUserSign = currentUser.isAdmin || currentUser.role === role;

                              if (canUserSign) {
                                return (
                                  <td key={role} className="py-2 px-2 text-center">
                                    <button
                                      type="button"
                                      onClick={() => handleVerify(act, role)}
                                      className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-[10px] font-bold shadow-sm hover:shadow transition flex items-center justify-center gap-1 mx-auto"
                                      title={`Sign off as ${role}`}
                                    >
                                      <Icon name="check" size={11} />
                                      <span>Verify</span>
                                    </button>
                                  </td>
                                );
                              }

                              return (
                                <td key={role} className="py-2 px-2 text-center">
                                  <span className="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400">
                                    Pending {role}
                                  </span>
                                </td>
                              );
                            })}

                            {/* Status Badge */}
                            <td className="py-2 px-3 text-center">
                              {status === 'COMPLETED' ? (
                                <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800">
                                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500" />
                                  Completed
                                </span>
                              ) : status === 'IN_PROGRESS' ? (
                                <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-800 dark:bg-blue-950/60 dark:text-blue-300 border border-blue-300 dark:border-blue-800">
                                  <span className="w-1.5 h-1.5 rounded-full bg-blue-500" />
                                  In Progress
                                </span>
                              ) : status === 'QUERY_RAISED' ? (
                                <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300 border border-rose-300 dark:border-rose-800 animate-pulse">
                                  <span className="w-1.5 h-1.5 rounded-full bg-rose-500" />
                                  Query Active
                                </span>
                              ) : status === 'NA' ? (
                                <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400">
                                  N/A
                                </span>
                              ) : status === 'SKIPPED' ? (
                                <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-500">
                                  Skipped
                                </span>
                              ) : (
                                <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">
                                  Pending
                                </span>
                              )}
                            </td>

                            {/* Actions / Query & History Buttons */}
                            <td className="py-2 px-2 text-center">
                              <div className="flex items-center justify-center gap-1">
                                <button
                                  type="button"
                                  onClick={() => onOpenQueryModal(act, log)}
                                  className={`p-1.5 rounded-lg transition ${
                                    isQuery
                                      ? 'bg-rose-100 text-rose-700 dark:bg-rose-900/60 dark:text-rose-300 hover:bg-rose-200'
                                      : 'text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800'
                                  }`}
                                  title={isQuery ? "View / Resolve Query" : "Raise Verification Query"}
                                >
                                  <Icon name="flag" size={14} />
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setHistoryModalAct({ act, log })}
                                  className="p-1.5 rounded-lg text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800 relative transition"
                                  title="View Chronological Audit History Trail"
                                >
                                  <Icon name="clock" size={14} />
                                  {log.history && log.history.length > 0 && (
                                    <span className="absolute top-1 right-1 w-1.5 h-1.5 bg-indigo-500 rounded-full" />
                                  )}
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Floating Bulk Action Bar */}
      {selectedIds.length > 0 && (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-40 bg-slate-900/95 dark:bg-slate-800/95 backdrop-blur-md text-white px-5 py-3 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-4 animate-in fade-in duration-200">
          <span className="text-xs font-bold bg-indigo-600 px-2.5 py-1 rounded-xl">
            {selectedIds.length} Selected
          </span>

          <div className="flex items-center gap-2 text-xs">
            <button
              onClick={handleBulkSetPerformed}
              className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-xl font-semibold transition"
            >
              Set Performed (Today)
            </button>
            <button
              onClick={handleBulkVerify}
              className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-semibold transition flex items-center gap-1.5"
            >
              <Icon name="check" size={14} />
              <span>Bulk Verify ({currentUser.role})</span>
            </button>
            <button
              onClick={() => handleBulkToggleNA(true)}
              className="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-xl font-semibold transition"
            >
              Mark N/A
            </button>
            <button
              onClick={() => handleBulkToggleNA(false)}
              className="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-xl font-semibold transition"
            >
              Mark Applicable
            </button>
          </div>

          <button
            onClick={() => setSelectedIds([])}
            className="p-1 rounded-lg text-slate-400 hover:text-white"
            title="Deselect All"
          >
            <Icon name="x" size={16} />
          </button>
        </div>
      )}
      {/* Activity History Viewer Modal */}
      {historyModalAct && (
        <ActivityHistoryModal
          activity={historyModalAct.act}
          log={currentLogs[historyModalAct.act.id] || historyModalAct.log}
          onClose={() => setHistoryModalAct(null)}
        />
      )}
    </div>
  );
}



function MyActionQueueView({
  activities,
  contexts,
  currentContextKey,
  config,
  currentUser,
  onNavigateToContext,
  onDirectPerform,
  onDirectVerify,
  onOpenQueryModal
}) {
  const [queueFilter, setQueueFilter] = useState("ALL");
  const [selectedQueueIds, setSelectedQueueIds] = useState([]);

  // Merge active context so brand new sessions immediately show tasks
  const mergedContexts = useMemo(() => {
    if (currentContextKey && !contexts[currentContextKey]) {
      return {
        ...contexts,
        [currentContextKey]: { headerMetrics: {}, logs: {} }
      };
    }
    return contexts;
  }, [contexts, currentContextKey]);

  // Collect all actionable items across contexts for this user (deduplicated via shared helper)
  const actionableItems = useMemo(() => {
    return computeUserActionableItems(activities, mergedContexts, config, currentUser);
  }, [activities, mergedContexts, config, currentUser]);

  const filteredItems = useMemo(() => {
    if (queueFilter === "PERFORM") return actionableItems.filter(i => i.actionType === "PERFORM");
    if (queueFilter === "VERIFY") return actionableItems.filter(i => i.actionType === "VERIFY");
    if (queueFilter === "QUERY") return actionableItems.filter(i => i.actionType === "QUERY_RESOLVE");
    return actionableItems;
  }, [actionableItems, queueFilter]);

  const handleBulkQueueVerify = () => {
    const today = getTodayYYYYMMDD();
    selectedQueueIds.forEach(queueId => {
      const item = actionableItems.find(i => i.id === queueId);
      if (item && item.actionType === "VERIFY") {
        onDirectVerify(item.ctxKey, item.activity.id, currentUser.role, today);
      }
    });
    setSelectedQueueIds([]);
  };

  const handleBulkQueuePerform = () => {
    const today = getTodayYYYYMMDD();
    selectedQueueIds.forEach(queueId => {
      const item = actionableItems.find(i => i.id === queueId);
      if (item && item.actionType === "PERFORM") {
        onDirectPerform(item.ctxKey, item.activity.id, today);
      }
    });
    setSelectedQueueIds([]);
  };

  const toggleSelectQueue = (id) => {
    setSelectedQueueIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  };

  return (
    <div className="max-w-[1700px] mx-auto px-4 py-4 space-y-4 pb-24">
      {/* Header Banner */}
      <div className="bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 rounded-2xl p-5 text-white shadow-lg flex flex-wrap items-center justify-between gap-4">
        <div>
          <div className="flex items-center gap-2">
            <div className="p-2 rounded-xl bg-indigo-500/30 backdrop-blur-md">
              <Icon name="check-square" size={20} />
            </div>
            <h1 className="text-lg font-bold">My Role Action Queue (Inbox)</h1>
          </div>
          <p className="text-xs text-indigo-200 mt-1">
            Dedicated queue of examination activities requiring your action as <strong className="text-white">{currentUser.name} ({currentUser.role})</strong> across assigned Colleges & Programs.
          </p>
        </div>

        {/* Filter Pills */}
        <div className="flex items-center gap-2 text-xs bg-slate-900/40 p-1.5 rounded-xl border border-indigo-700/50">
          <button
            onClick={() => setQueueFilter("ALL")}
            className={`px-3 py-1.5 rounded-lg font-semibold transition ${
              queueFilter === "ALL" ? "bg-indigo-600 text-white shadow" : "text-indigo-200 hover:text-white"
            }`}
          >
            All Pending ({actionableItems.length})
          </button>
          <button
            onClick={() => setQueueFilter("PERFORM")}
            className={`px-3 py-1.5 rounded-lg font-semibold transition ${
              queueFilter === "PERFORM" ? "bg-indigo-600 text-white shadow" : "text-indigo-200 hover:text-white"
            }`}
          >
            To Perform ({actionableItems.filter(i => i.actionType === "PERFORM").length})
          </button>
          <button
            onClick={() => setQueueFilter("VERIFY")}
            className={`px-3 py-1.5 rounded-lg font-semibold transition ${
              queueFilter === "VERIFY" ? "bg-indigo-600 text-white shadow" : "text-indigo-200 hover:text-white"
            }`}
          >
            To Verify ({actionableItems.filter(i => i.actionType === "VERIFY").length})
          </button>
          <button
            onClick={() => setQueueFilter("QUERY")}
            className={`px-3 py-1.5 rounded-lg font-semibold transition ${
              queueFilter === "QUERY" ? "bg-red-600 text-white shadow" : "text-indigo-200 hover:text-white"
            }`}
          >
            Queries ({actionableItems.filter(i => i.actionType === "QUERY_RESOLVE").length})
          </button>
        </div>
      </div>

      {/* Queue List Table */}
      <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
        {filteredItems.length === 0 ? (
          <div className="py-16 text-center text-slate-400 space-y-2">
            <div className="inline-flex p-3 rounded-full bg-slate-100 dark:bg-slate-800 text-emerald-500">
              <Icon name="check-circle" size={32} />
            </div>
            <h3 className="text-sm font-bold text-slate-800 dark:text-slate-200">All caught up!</h3>
            <p className="text-xs">No pending activities or verifications currently awaiting your action.</p>
          </div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-left text-xs border-collapse">
              <thead>
                <tr className="bg-slate-100/70 dark:bg-slate-800/70 text-slate-500 font-semibold border-b border-slate-200 dark:border-slate-800 uppercase text-[10px]">
                  <th className="py-3 px-3 w-8 text-center">
                    <input
                      type="checkbox"
                      onChange={(e) => {
                        if (e.target.checked) setSelectedQueueIds(filteredItems.map(i => i.id));
                        else setSelectedQueueIds([]);
                      }}
                      checked={selectedQueueIds.length > 0 && selectedQueueIds.length === filteredItems.length}
                      className="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                    />
                  </th>
                  <th className="py-3 px-3">Context (College • Program • Sem)</th>
                  <th className="py-3 px-3">Phase & Activity</th>
                  <th className="py-3 px-3 w-28 text-center">Action Required</th>
                  <th className="py-3 px-3 w-40 text-center">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-800/60">
                {filteredItems.map(item => {
                  const isSelected = selectedQueueIds.includes(item.id);
                  const isQuery = item.actionType === "QUERY_RESOLVE";

                  return (
                    <tr
                      key={item.id}
                      className={`hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition ${
                        isQuery ? "bg-red-50/50 dark:bg-red-950/20" : ""
                      }`}
                    >
                      <td className="py-2.5 px-3 text-center">
                        <input
                          type="checkbox"
                          checked={isSelected}
                          onChange={() => toggleSelectQueue(item.id)}
                          className="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                        />
                      </td>

                      <td className="py-2.5 px-3">
                        <div className="font-bold text-slate-900 dark:text-white">
                          {item.college} • {item.program}
                        </div>
                        <div className="text-[10px] text-slate-500 font-mono">
                          {item.semester} • {item.examCycle} ({item.batch})
                        </div>
                      </td>

                      <td className="py-2.5 px-3">
                        <div className="font-semibold text-slate-900 dark:text-white">
                          #{item.activity.srNo}: {item.activity.name}
                        </div>
                        <div className="text-[10px] text-slate-500">{item.activity.phase}</div>
                        {isQuery && (
                          <div className="mt-1 text-[11px] text-red-600 dark:text-red-400 font-medium bg-red-100/70 dark:bg-red-950/60 px-2 py-0.5 rounded-lg inline-block">

                      <td className="py-2.5 px-3 text-center">

                          item.actionType === "PERFORM" ? "bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-300" :
                          item.actionType === "VERIFY" ? "bg-indigo-100 text-indigo-800 dark:bg-indigo-900/60 dark:text-indigo-300" :

                      <td className="py-2.5 px-3 text-center">
                        <div className="flex items-center justify-center gap-1.5">

                            <button
                              onClick={() => onDirectPerform(item.ctxKey, item.activity.id, getTodayYYYYMMDD())}
                              className="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-bold text-[10px] shadow-sm flex items-center gap-1"
                            >
                              <Icon name="check" size={11} />
                              <span>Perform Today</span>
                            </button>
                          )}

                          {item.actionType === "VERIFY" && (
                            <button
                              onClick={() => onDirectVerify(item.ctxKey, item.activity.id, currentUser.role, getTodayYYYYMMDD())}
                              className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold text-[10px] shadow-sm flex items-center gap-1"
                            >
                              <Icon name="check" size={11} />
                              <span>Verify Today</span>
                            </button>
                          )}

                          {item.actionType === "QUERY_RESOLVE" && (
                            <button
                              onClick={() => onOpenQueryModal(item.activity, item.log, item.ctxKey)}
                              className="px-2.5 py-1 bg-red-600 hover:bg-red-700 text-white rounded-lg font-bold text-[10px] shadow-sm flex items-center gap-1"
                            >
                              <Icon name="flag" size={11} />
                              <span>Resolve</span>
                            </button>
                          )}

                          <button
                            onClick={() => onNavigateToContext(item.college, item.batch, item.program, item.semester, item.examCycle)}
                            className="p-1 rounded-lg text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800"
                            title="Jump to Workspace Context"
                          >
                            <Icon name="external-link" size={14} />
                          </button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* Queue Bulk Actions */}
      {selectedQueueIds.length > 0 && (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-40 bg-slate-900/95 text-white px-5 py-3 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-4">
          <span className="text-xs font-bold bg-indigo-600 px-2.5 py-1 rounded-xl">
            {selectedQueueIds.length} Selected
          </span>
          <button
            onClick={handleBulkQueueVerify}
            className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-semibold text-xs transition flex items-center gap-1.5"
          >
            <Icon name="check" size={14} />
            <span>Bulk Verify Selected</span>
          </button>
          <button
            onClick={handleBulkQueuePerform}
            className="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 rounded-xl font-semibold text-xs transition"
          >
            Bulk Perform Selected
          </button>
          <button onClick={() => setSelectedQueueIds([])} className="p-1 text-slate-400 hover:text-white">
            <Icon name="x" size={16} />
          </button>
        </div>
      )}
    </div>
  );
}

// --- Executive Dashboard & RAG Heatmap ---
function ExecutiveDashboardView({
  activities,
  contexts,
  config,
  onNavigateToContextPhase
}) {
  const phases = useMemo(() => {
    const list = config?.phases && config.phases.length > 0 ? [...config.phases] : [...INITIAL_PHASES];
    activities.forEach(a => {
      if (a.phase && !list.includes(a.phase)) list.push(a.phase);
    });
    return list;
  }, [activities, config?.phases]);

  // Aggregate metrics across all saved contexts
  const summary = useMemo(() => {
    let totalStudents = 0;
    let totalPwd = 0;
    let totalDebarred = 0;
    let totalUfm = 0;
    let totalQueries = 0;
    let totalCompleted = 0;
    let totalActiveTasks = 0;

    Object.values(contexts).forEach(ctx => {
      const m = ctx.headerMetrics || {};
      totalStudents += (m.totalStudents || 0);
      totalPwd += (m.pwdStudents || 0);
      totalDebarred += (m.debarredStudents || 0);
      totalUfm += (m.ufmCases || 0);

      const logs = ctx.logs || {};
      activities.forEach(act => {
        const log = logs[act.id];
        if (log && !log.isNA) {
          totalActiveTasks++;
          if (log.queryDetails && !log.queryDetails.resolved) totalQueries++;
          const mRank = ROLE_RANKS[act.performedBy] ?? -1;
          const vReqs = (act.requiredVerifiers || []).filter(r => (ROLE_RANKS[r] ?? -1) > mRank);
          const allV = vReqs.length === 0 || vReqs.every(r => log.verifications?.[r]?.verified);
          if (log.performedDate && allV) totalCompleted++;
        }
      });
    });

    const overallPct = totalActiveTasks > 0 ? Math.round((totalCompleted / totalActiveTasks) * 100) : 0;
    return { totalStudents, totalPwd, totalDebarred, totalUfm, totalQueries, totalCompleted, totalActiveTasks, overallPct };
  }, [activities, contexts]);

  // Heatmap matrix: College x Phase
  const heatmapData = useMemo(() => {
    const matrix = {};
    config.colleges.forEach(col => {
      matrix[col.id] = { college: col, phaseStats: {}, overall: { completed: 0, total: 0, pct: 0 } };
      phases.forEach(ph => {
        matrix[col.id].phaseStats[ph] = { completed: 0, total: 0, pct: 0 };
      });
    });

    // Populate from contexts
    Object.entries(contexts).forEach(([ctxKey, ctxData]) => {
      const colId = ctxKey.split('__')[0];
      if (!matrix[colId]) return;

      const logs = ctxData.logs || {};
      activities.forEach(act => {
        const log = logs[act.id] || {};
        if (log.isNA) return;

        matrix[colId].phaseStats[act.phase].total++;
        matrix[colId].overall.total++;

        const mRank2 = ROLE_RANKS[act.performedBy] ?? -1;
        const vReqs2 = (act.requiredVerifiers || []).filter(r => (ROLE_RANKS[r] ?? -1) > mRank2);
        const allV = vReqs2.length === 0 || vReqs2.every(r => log.verifications?.[r]?.verified);
        if (log.performedDate && allV) {
          matrix[colId].phaseStats[act.phase].completed++;
          matrix[colId].overall.completed++;
        }
      });
    });

    // Calculate percentages
    Object.values(matrix).forEach(row => {
      phases.forEach(ph => {
        const st = row.phaseStats[ph];
        st.pct = st.total > 0 ? Math.round((st.completed / st.total) * 100) : 0;
      });
      row.overall.pct = row.overall.total > 0 ? Math.round((row.overall.completed / row.overall.total) * 100) : 0;
    });

    return matrix;
  }, [activities, contexts, config.colleges, phases]);

  // Top Bottlenecks
  const bottlenecks = useMemo(() => {
    const counts = {};
    Object.values(contexts).forEach(ctx => {
      const logs = ctx.logs || {};
      activities.forEach(act => {
        const log = logs[act.id] || {};
        if (log.isNA) return;
        const isQ = log.queryDetails && !log.queryDetails.resolved;
        const reqs = (act.requiredVerifiers || []).filter(r => (ROLE_RANKS[r] ?? -1) > (ROLE_RANKS[act.performedBy] ?? -1));
        const isPendingVerif = log.performedDate && !reqs.every(r => log.verifications?.[r]?.verified);

        if (isQ || isPendingVerif) {
          if (!counts[act.id]) {
            counts[act.id] = { activity: act, queries: 0, pendingVerifs: 0 };
          }
          if (isQ) counts[act.id].queries++;
          if (isPendingVerif) counts[act.id].pendingVerifs++;
        }
      });
    });

    return Object.values(counts)
      .sort((a, b) => (b.queries * 2 + b.pendingVerifs) - (a.queries * 2 + a.pendingVerifs))
      .slice(0, 6);
  }, [activities, contexts]);

  return (
    <div className="max-w-[1700px] mx-auto px-4 py-4 space-y-4 pb-24">
      {/* Top Title Banner */}
      <div className="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
            <Icon name="bar-chart-3" size={22} className="text-indigo-600 dark:text-indigo-400" />
            <span>Executive Dashboard & RAG Progress Heatmap</span>
          </h1>
          <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
            Cross-College, Multi-Phase Examination Verification Matrix & Integrity Overview
          </p>
        </div>
      </div>

      {/* KPI Cards Row */}
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
        <div className="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
          <div className="text-[10px] font-bold text-slate-400 uppercase">Overall Compliance</div>
          <div className="text-xl font-bold text-indigo-600 dark:text-indigo-400 mt-1">
            {summary.overallPct}%
          </div>
          <div className="text-[10px] text-slate-500 mt-0.5">{summary.totalCompleted} Completed Tasks</div>
        </div>

        <div className="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
          <div className="text-[10px] font-bold text-slate-400 uppercase">Active Queries</div>
          <div className="text-xl font-bold text-rose-600 mt-1">
            {summary.totalQueries}
          </div>
          <div className="text-[10px] text-slate-500 mt-0.5">Discrepancies Flagged</div>
        </div>

        <div className="bg-white dark:bg-slate-900 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
          <div className="text-[10px] font-bold text-slate-400 uppercase">Total Students</div>
          <div className="text-xl font-bold text-slate-900 dark:text-white mt-1">
            {summary.totalStudents}
          </div>
          <div className="text-[10px] text-slate-500 mt-0.5">Across Colleges</div>
        </div>

        <div className="bg-purple-50/60 dark:bg-purple-950/20 p-3.5 rounded-2xl border border-purple-200 dark:border-purple-900/60 shadow-sm">
          <div className="text-[10px] font-bold text-purple-700 dark:text-purple-300 uppercase">PWD Students</div>
          <div className="text-xl font-bold text-purple-900 dark:text-purple-200 mt-1">
            {summary.totalPwd}
          </div>
          <div className="text-[10px] text-purple-600 dark:text-purple-400 mt-0.5">Special Concessions</div>
        </div>

        <div className="bg-rose-50/60 dark:bg-rose-950/20 p-3.5 rounded-2xl border border-rose-200 dark:border-rose-900/60 shadow-sm">
          <div className="text-[10px] font-bold text-rose-700 dark:text-rose-300 uppercase">Debarred Students</div>
          <div className="text-xl font-bold text-rose-900 dark:text-rose-200 mt-1">
            {summary.totalDebarred}
          </div>
          <div className="text-[10px] text-rose-600 dark:text-rose-400 mt-0.5">Attendance Defaulters</div>
        </div>

        <div className="bg-amber-50/60 dark:bg-amber-950/20 p-3.5 rounded-2xl border border-amber-200 dark:border-amber-900/60 shadow-sm">
          <div className="text-[10px] font-bold text-amber-700 dark:text-amber-300 uppercase">UFM Pending</div>
          <div className="text-xl font-bold text-amber-900 dark:text-amber-200 mt-1">
            {summary.totalUfm}
          </div>
          <div className="text-[10px] text-amber-600 dark:text-amber-400 mt-0.5">UMIC Committee Cases</div>
        </div>
      </div>

      {/* Cross-College & Cross-Phase RAG Heatmap Table */}
      <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden p-4">
        <div className="flex items-center justify-between mb-3">
          <div>
            <h3 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
              <span>Phase-by-Phase College RAG Progress Matrix</span>
              <span className="text-[10px] font-normal text-slate-400">(Click any cell to filter Activity Tracker)</span>
            </h3>
          </div>
          <div className="flex items-center gap-2 text-[10px]">
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-emerald-500" /> &gt;= 80% (Green)</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-amber-500" /> 40% - 79% (Amber)</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-rose-500" /> &lt; 40% (Red)</span>
          </div>
        </div>

        <div className="overflow-x-auto">
          <table className="w-full text-center text-xs border-collapse">
            <thead>
              <tr className="bg-slate-100/70 dark:bg-slate-800/70 text-slate-600 dark:text-slate-300 font-bold uppercase text-[10px]">
                <th className="py-2.5 px-3 text-left">College</th>
                {phases.map((ph, idx) => (
                  <th key={ph} className="py-2.5 px-2 max-w-[120px] truncate" title={ph}>
                    P{idx + 1}: {ph.split(':')[1] || ph}
                  </th>
                ))}
                <th className="py-2.5 px-3 bg-indigo-50/50 dark:bg-indigo-950/30">Overall %</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
              {config.colleges.map(col => {
                const row = heatmapData[col.id] || { phaseStats: {}, overall: { pct: 0 } };
                return (
                  <tr key={col.id} className="hover:bg-slate-50/50 dark:hover:bg-slate-800/40 transition">
                    <td className="py-3 px-3 text-left font-bold text-slate-900 dark:text-white">
                      {col.name}
                    </td>

                    {phases.map(ph => {
                      const st = row.phaseStats[ph] || { completed: 0, total: 0, pct: 0 };
                      let cellClass = "bg-rose-50 text-rose-800 border-rose-200 dark:bg-rose-950/40 dark:text-rose-300 dark:border-rose-900/60";
                      if (st.pct >= 80) {
                        cellClass = "bg-emerald-50 text-emerald-800 border-emerald-200 dark:bg-emerald-950/40 dark:text-emerald-300 dark:border-emerald-900/60";
                      } else if (st.pct >= 40) {
                        cellClass = "bg-amber-50 text-amber-800 border-amber-200 dark:bg-amber-950/40 dark:text-amber-300 dark:border-amber-900/60";
                      }

                      return (
                        <td key={ph} className="py-2.5 px-1.5">
                          <button
                            type="button"
                            onClick={() => onNavigateToContextPhase(col.id, ph)}
                            className={`w-full py-1.5 px-1 rounded-xl font-bold border transition text-[11px] shadow-sm hover:scale-[1.03] ${cellClass}`}
                            title={`Click to jump to ${col.name} - ${ph}`}
                          >
                            {st.pct}%
                            <div className="text-[9px] font-normal opacity-80">{st.completed}/{st.total}</div>
                          </button>
                        </td>
                      );
                    })}

                    {/* Overall College Cell */}
                    <td className="py-2.5 px-2 font-bold bg-indigo-50/50 dark:bg-indigo-950/30">
                      <div className="inline-block px-2.5 py-1 rounded-xl bg-indigo-600 text-white shadow-sm font-mono text-xs">
                        {row.overall.pct}%
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {/* Top Pending Bottlenecks */}
      <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm p-4">
        <h3 className="text-sm font-bold text-slate-900 dark:text-white mb-2 flex items-center gap-2">
          <Icon name="alert-triangle" size={16} className="text-amber-500" />
          <span>Top Verification Bottlenecks & Queries Requiring Action</span>
        </h3>
        {bottlenecks.length === 0 ? (
          <div className="text-xs text-slate-400 py-4 text-center">No active verification bottlenecks found.</div>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mt-2">
            {bottlenecks.map(b => (
              <div key={b.activity.id} className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700">
                <div className="flex items-center justify-between text-xs font-bold text-slate-900 dark:text-white">
                  <span>#{b.activity.srNo} {b.activity.name}</span>
                  <span className="text-[10px] px-1.5 py-0.2 rounded bg-indigo-100 text-indigo-700 dark:bg-indigo-900 dark:text-indigo-300">
                    {b.activity.performedBy}
                  </span>
                </div>
                <div className="text-[11px] text-slate-500 mt-0.5">{b.activity.phase}</div>
                <div className="flex items-center gap-2 mt-2 text-[10px]">
                  {b.queries > 0 && (
                    <span className="px-2 py-0.5 rounded bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300 font-bold">
                      ⚠️ {b.queries} Query Flagged
                    </span>
                  )}
                  {b.pendingVerifs > 0 && (
                    <span className="px-2 py-0.5 rounded bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 font-semibold">
                      ⌛ {b.pendingVerifs} Pending Sign-off
                    </span>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// --- Admin Control Panel ---
function AdminPanel({
  users,
  activities,
  contexts,
  config,
  currentLogs,
  context,
  headerMetrics,
  onSaveUser,
  onDeleteUser,
  onResetPassword,
  onSaveActivity,
  onDeleteActivity,
  onSaveConfig,
  onCascadeRenameCollege,
  onCascadeRenameProgram,
  onCascadeRenamePhase,
  onCascadeReorderPhases,
  onCascadeRenameBatch,
  onRestoreBackup,
  onResetToSeed,
  onOpenAuditModal,
  showConfirm,
  showToast
}) {
  const activePhases = useMemo(() => {
    const list = config?.phases && config.phases.length > 0 ? [...config.phases] : [...INITIAL_PHASES];
    activities.forEach(a => {
      if (a.phase && !list.includes(a.phase)) list.push(a.phase);
    });
    return list;
  }, [config?.phases, activities]);
  const [editingCollegeId, setEditingCollegeId] = useState(null);
  const [editColName, setEditColName] = useState("");
  const [editColCode, setEditColCode] = useState("");

  const [editingProgName, setEditingProgName] = useState(null);
  const [editProgVal, setEditProgVal] = useState("");

  const [editingPhaseName, setEditingPhaseName] = useState(null);
  const [editPhaseVal, setEditPhaseVal] = useState("");
  const [newPhaseInput, setNewPhaseInput] = useState("");

  const [editingBatchVal, setEditingBatchVal] = useState(null);
  const [editBatchVal, setEditBatchVal] = useState("");
  const [adminTab, setAdminTab] = useState("staff");
  const [staffSearch, setStaffSearch] = useState("");
  const [editingUser, setEditingUser] = useState(null);
  const [isAddingUser, setIsAddingUser] = useState(false);

  // Activity Master State
  const [actSearch, setActSearch] = useState("");
  const [actPhaseFilter, setActPhaseFilter] = useState("ALL");
  const [editingAct, setEditingAct] = useState(null);
  const [isAddingAct, setIsAddingAct] = useState(false);

  // Colleges & Batches State
  const [newCollegeName, setNewCollegeName] = useState("");
  const [newCollegeCode, setNewCollegeCode] = useState("");
  const [newBatch, setNewBatch] = useState("");
  const [newProgramName, setNewProgramName] = useState("");
  const [progCollegeSelect, setProgCollegeSelect] = useState(config.colleges[0]?.id || "");

  // Filtered staff
  const filteredStaff = useMemo(() => {
    return users.filter(u => {
      const q = staffSearch.toLowerCase().trim();
      if (!q) return true;
      return u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || u.role.toLowerCase().includes(q);
    });
  }, [users, staffSearch]);

  // Filtered activities (sorted by Sr. No.)
  const filteredActs = useMemo(() => {
    return activities
      .filter(a => {
        if (actPhaseFilter !== "ALL" && a.phase !== actPhaseFilter) return false;
        if (actSearch.trim()) {
          const q = actSearch.toLowerCase().trim();
          return a.name.toLowerCase().includes(q) || String(a.srNo).includes(q);
        }
        return true;
      })
      .sort((a, b) => (a.srNo || 0) - (b.srNo || 0));
  }, [activities, actPhaseFilter, actSearch]);

  const phases = useMemo(() => {
    const list = [];
    activities.forEach(a => {
      if (!list.includes(a.phase)) list.push(a.phase);
    });

            }`}
          >
            Staff & Assignments
          </button>
          <button

                    <td className="py-2.5 px-2 text-center">

                        </span>
                      ) : (
                        <span className="text-slate-400 text-[10px]">—</span>

                    </td>
                    <td className="py-2.5 px-3">
                      <div className="text-slate-700 dark:text-slate-300 font-medium">

                      </div>

                    <td className="py-2.5 px-3">

                      </div>
                    </td>
                    <td className="py-2.5 px-2 text-center">
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                        u.active ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300'

                    <td className="py-2.5 px-3 text-right">
                      <div className="flex items-center justify-end gap-1.5">
                        <button
                          onClick={() => onResetPassword(u.id)}

                        </button>
                        <button
                          onClick={() => onDeleteUser(u.id)}

                          title="Delete User"
                        >
                          <Icon name="trash-2" size={14} />
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

                  <th className="py-2.5 px-2 text-right">Edit</th>

                    <td className="py-2 px-3 text-[11px] text-slate-500">{a.phase}</td>

                    <td className="py-2 px-3 text-[11px] text-slate-600 dark:text-slate-300">

                    <td className="py-2 px-2 text-right">
                      <div className="flex items-center justify-end gap-1">

                          title="Edit Activity"
                        >
                          <Icon name="edit-2" size={14} />
                        </button>
                        <button
                          onClick={() => {
                          showConfirm({
                            title: "Delete Master Activity",
                            message: `Are you sure you want to delete Activity #${a.srNo}: "${a.name}"? This removes it permanently from the activity master list.`,
                            confirmText: "Delete",
                            cancelText: "Cancel",
                            type: "danger",
                            onConfirm: () => onDeleteActivity(a.id)
                          });
                        }}
                          className="p-1 text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"
                          title="Delete Activity"
                        >
                          <Icon name="trash-2" size={14} />
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

      {/* Tab 3: Colleges, Programs, Phases & Batches Manager (2x2 Grid) */}

              <h3 className="text-xs font-bold text-slate-900 dark:text-white uppercase tracking-wider flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-800">

                <Icon name="building" size={16} className="text-indigo-600" />

                      <div className="flex gap-2">

                          type="text"
                          value={editColName}
                          onChange={(e) => setEditColName(e.target.value)}
                          placeholder="College Name"
                          className="flex-1 px-2 py-1 bg-white dark:bg-slate-900 border rounded-lg"
                        />
                        <input
                          type="text"
                          value={editColCode}
                          onChange={(e) => setEditColCode(e.target.value.toUpperCase())}

                          className="w-20 px-2 py-1 bg-white dark:bg-slate-900 border rounded-lg font-mono font-bold"

                      <div className="flex justify-end gap-1.5">

                          onClick={() => setEditingCollegeId(null)}

                          onClick={() => {
                            if (!editColName.trim() || !editColCode.trim()) {
                              showToast("College Name and Shortform/Code are required.", "warning");
                              return;
                            }
                            const newCode = editColCode.trim().toUpperCase();
                            onCascadeRenameCollege(c.id, newCode, editColName.trim());
                            setEditingCollegeId(null);
                          }}
                          className="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1"
                        >
                          <Icon name="check" size={12} />
                          <span>Save</span>
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div key={c.id} className="flex items-center justify-between p-2 bg-slate-50 dark:bg-slate-800/60 rounded-xl text-xs">
                      <div>
                        <span className="font-bold text-slate-900 dark:text-white">{c.name}</span>
                        <span className="ml-1 text-[10px] text-slate-400 font-mono font-semibold">({c.id})</span>

                      <div className="flex items-center gap-1">
                        <button
                          onClick={() => {
                            setEditingCollegeId(c.id);

                            setEditColCode(c.id);

                          <Icon name="edit-2" size={13} />

                        <button
                          onClick={() => {
                            if (config.colleges.length <= 1) {
                              showToast("Must keep at least 1 college.", "warning");

                            showConfirm({
                              title: "Delete College",
                              message: `Delete college ${c.name} (${c.id})? This will remove its associated programs and session access.`,
                              type: "danger",
                              onConfirm: () => {
                                const next = config.colleges.filter(x => x.id !== c.id);
                                onSaveConfig({ ...config, colleges: next });
                                showToast(`Deleted college ${c.name}`, "info");
                              }
                            });
                          }}
                          className="p-1 text-slate-400 hover:text-red-600 rounded"
                          title="Delete College"
                        >
                          <Icon name="trash-2" size={13} />
                        </button>
                      </div>
                    </div>
                  )
                ))}
              </div>

                  onChange={(e) => setNewCollegeName(e.target.value)}
                  className="flex-1 px-2.5 py-1 text-xs bg-slate-50 dark:bg-slate-800 border rounded-xl"
                />
                <input
                  type="text"
                  placeholder="Shortform (e.g. UPG)..."
                  value={newCollegeCode}
                  onChange={(e) => setNewCollegeCode(e.target.value.toUpperCase())}
                  className="w-28 px-2 py-1 text-xs bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono uppercase"
                />
              </div>
              <button
                onClick={() => {
                  if (!newCollegeName.trim()) return;
                  const code = (newCollegeCode.trim() || newCollegeName.replace(/[^a-zA-Z0-9]/g, '').slice(0, 8)).toUpperCase();
                  if (config.colleges.some(x => x.id === code)) {
                    showToast(`College with code ${code} already exists.`, "warning");
                    return;
                  }
                  const next = [...config.colleges, { id: code, name: newCollegeName.trim(), code }];
                  const nextProgs = { ...config.programs, [code]: config.programs[code] || [] };
                  onSaveConfig({ ...config, colleges: next, programs: nextProgs });
                  setNewCollegeName("");
                  setNewCollegeCode("");
                  showToast(`Added college ${newCollegeName.trim()} (${code})`, "success");
                }}
                className="w-full py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold"
              >
                Add College
              </button>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm p-4 space-y-3 flex flex-col justify-between">

                <h3 className="text-xs font-bold text-slate-900 dark:text-white uppercase tracking-wider">
