                        type="text"
                        value={editProgVal}
                        onChange={(e) => setEditProgVal(e.target.value)}
                        className="flex-1 px-2 py-0.5 bg-white dark:bg-slate-900 border rounded-lg text-xs"
                      />

                        onClick={() => {
                          if (!editProgVal.trim()) return;
                          onCascadeRenameProgram(progCollegeSelect, p, editProgVal.trim());
                          setEditingProgName(null);

                        className="p-1 text-emerald-600 hover:bg-emerald-100 rounded"
                        title="Save"
                      >
                        <Icon name="check" size={14} />
                      </button>

                        onClick={() => setEditingProgName(null)}
                        className="p-1 text-slate-400 hover:bg-slate-100 rounded"

                        <Icon name="x" size={14} />
                      </button>

                          onClick={() => {
                            setEditingProgName(p);

                          <Icon name="edit-2" size={13} />

                          onClick={() => {
                            showConfirm({
                              title: "Delete Program",
                              message: `Delete program "${p}" from ${progCollegeSelect}?`,
                              type: "danger",
                              onConfirm: () => {
                                const curList = config.programs[progCollegeSelect] || [];
                                const next = curList.filter(x => x !== p);
                                onSaveConfig({
                                  ...config,
                                  programs: { ...config.programs, [progCollegeSelect]: next }
                                });
                                showToast(`Deleted program ${p}`, "info");
                              }
                            });
                          }}
                          className="p-1 text-slate-400 hover:text-red-600 rounded"
                          title="Delete Program"
                        >
                          <Icon name="trash-2" size={13} />

                      </div>

                onClick={() => {
                  if (!newProgramName.trim()) return;
                  const cur = config.programs[progCollegeSelect] || [];

                    showToast(`Program "${newProgramName.trim()}" already exists in ${progCollegeSelect}.`, "warning");
                    return;
                  }
                  const next = [...cur, newProgramName.trim()];
                  onSaveConfig({
                    ...config,
                    programs: { ...config.programs, [progCollegeSelect]: next }
                  });
                  setNewProgramName("");
                  showToast(`Added program ${newProgramName.trim()}`, "success");
                }}
                className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold"
              >
                Add
              </button>
            </div>
          </div>

                        value={editPhaseVal}
                        onChange={(e) => setEditPhaseVal(e.target.value)}
                        className="flex-1 px-2 py-0.5 bg-white dark:bg-slate-900 border rounded-lg text-xs"

                      <button

                          if (!editPhaseVal.trim()) return;

                        <Icon name="x" size={14} />
                      </button>
                    </div>
                  ) : (
                    <div key={ph} className="flex items-center justify-between p-2 bg-slate-50 dark:bg-slate-800/60 rounded-xl text-xs">
                      <div className="flex items-center gap-1.5 min-w-0">
                        <span className="font-semibold text-slate-800 dark:text-slate-200 truncate">{ph}</span>
                        <span className="text-[10px] text-slate-400 font-mono shrink-0">({actsInPhase.length} acts)</span>
                      </div>
                      <div className="flex items-center gap-1 shrink-0">
                        <button
                          disabled={idx === 0}
                          onClick={() => {
                            const next = [...activePhases];
                            const tmp = next[idx - 1];
                            next[idx - 1] = next[idx];
                            next[idx] = tmp;
                            onCascadeReorderPhases(next);
                          }}
                          className={`p-1 rounded ${idx === 0 ? 'text-slate-200 dark:text-slate-800 cursor-not-allowed' : 'text-slate-400 hover:text-indigo-600'}`}
                          title="Move Up"
                        >
                          <Icon name="chevron-up" size={13} />
                        </button>
                        <button
                          disabled={idx === activePhases.length - 1}
                          onClick={() => {
                            const next = [...activePhases];
                            const tmp = next[idx + 1];
                            next[idx + 1] = next[idx];
                            next[idx] = tmp;
                            onCascadeReorderPhases(next);
                          }}
                          className={`p-1 rounded ${idx === activePhases.length - 1 ? 'text-slate-200 dark:text-slate-800 cursor-not-allowed' : 'text-slate-400 hover:text-indigo-600'}`}
                          title="Move Down"
                        >
                          <Icon name="chevron-down" size={13} />
                        </button>
                        <button
                          onClick={() => {
                            setEditingPhaseName(ph);
                            setEditPhaseVal(ph);
                          }}
                          className="p-1 text-slate-400 hover:text-indigo-600 rounded"
                          title="Rename Phase"
                        >
                          <Icon name="edit-2" size={13} />
                        </button>
                        <button
                          onClick={() => {
                            if (actsInPhase.length > 0) {
                              showToast(`Cannot delete phase "${ph}" because ${actsInPhase.length} activities are assigned to it. Reassign or delete those activities first.`, "warning");
                              return;
                            }
                            showConfirm({
                              title: "Delete Phase",
                              message: `Delete unused phase "${ph}"?`,
                              type: "danger",
                              onConfirm: () => {
                                const next = activePhases.filter(x => x !== ph);
                                onCascadeReorderPhases(next);
                                showToast(`Deleted phase "${ph}"`, "info");
                              }
                            });
                          }}
                          className="p-1 text-slate-400 hover:text-red-600 rounded"
                          title="Delete Phase"
                        >
                          <Icon name="trash-2" size={13} />
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="pt-3 border-t border-slate-100 dark:border-slate-800 flex gap-2">
              <input
                type="text"
                placeholder="e.g. Phase 8: Supplementary"
                value={newPhaseInput}
                onChange={(e) => setNewPhaseInput(e.target.value)}
                className="flex-1 px-2.5 py-1 text-xs bg-slate-50 dark:bg-slate-800 border rounded-xl"
              />
              <button
                onClick={() => {
                  if (!newPhaseInput.trim()) return;
                  if (activePhases.includes(newPhaseInput.trim())) {
                    showToast(`Phase "${newPhaseInput.trim()}" already exists.`, "warning");
                    return;
                  }
                  onCascadeReorderPhases([...activePhases, newPhaseInput.trim()]);
                  setNewPhaseInput("");
                  showToast("Phase added successfully", "success");
                }}
                className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold"
              >
                Add
              </button>
            </div>
          </div>

          {/* Card 4: Academic Year Batches Manager */}
          <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm p-4 space-y-3 flex flex-col justify-between">
            <div>
              <h3 className="text-xs font-bold text-slate-900 dark:text-white uppercase tracking-wider flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-800">
                <span>Academic Year Batches ({config.batches.length})</span>
                <Icon name="calendar" size={16} className="text-indigo-600" />
              </h3>

              <div className="space-y-1.5 mt-3 max-h-[260px] overflow-y-auto pr-1">
                {config.batches.map(b => (
                  editingBatchVal === b ? (
                    <div key={b} className="flex items-center gap-1.5 p-1.5 bg-indigo-50/70 dark:bg-indigo-950/40 rounded-xl border border-indigo-200 dark:border-indigo-800 text-xs">
                      <input
                        type="text"
                        value={editBatchVal}
                        onChange={(e) => setEditBatchVal(e.target.value)}
                        className="flex-1 px-2 py-0.5 bg-white dark:bg-slate-900 border rounded-lg text-xs font-mono font-bold"
                      />
                      <button
                        onClick={() => {
                          if (!editBatchVal.trim()) return;
                          onCascadeRenameBatch(b, editBatchVal.trim());
                          setEditingBatchVal(null);
                        }}
                        className="p-1 text-emerald-600 hover:bg-emerald-100 rounded"
                        title="Save"
                      >
                        <Icon name="check" size={14} />
                      </button>
                      <button
                        onClick={() => setEditingBatchVal(null)}
                        className="p-1 text-slate-400 hover:bg-slate-100 rounded"
                        title="Cancel"
                      >
                        <Icon name="x" size={14} />
                      </button>
                    </div>
                  ) : (
                    <div key={b} className="flex items-center justify-between p-2 bg-slate-50 dark:bg-slate-800/60 rounded-xl text-xs font-mono font-bold">
                      <span>{b}</span>
                      <div className="flex items-center gap-1">
                        <button
                          onClick={() => {
                            setEditingBatchVal(b);
                            setEditBatchVal(b);
                          }}
                          className="p-1 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 rounded"
                          title="Edit / Rename Batch"
                        >
                          <Icon name="edit-2" size={13} />
                        </button>
                        <button
                          onClick={() => {
                            if (config.batches.length <= 1) {
                              showToast("Must keep at least 1 batch.", "warning");
                              return;
                            }
                            showConfirm({
                              title: "Delete Batch",
                              message: `Delete batch ${b}?`,
                              type: "danger",
                              onConfirm: () => {
                                const next = config.batches.filter(x => x !== b);
                                onSaveConfig({ ...config, batches: next });
                                showToast(`Deleted batch ${b}`, "info");
                              }
                            });
                          }}
                          className="p-1 text-slate-400 hover:text-red-600 rounded"
                          title="Delete Batch"
                        >
                          <Icon name="trash-2" size={13} />
                        </button>
                      </div>
                    </div>
                  )
                ))}
              </div>
            </div>

            <div className="pt-3 border-t border-slate-100 dark:border-slate-800 flex gap-2">
              <input
                type="text"
                placeholder="e.g. 2028-29"
                value={newBatch}
                onChange={(e) => setNewBatch(e.target.value)}
                className="flex-1 px-2.5 py-1 text-xs bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono"
              />
              <button
                onClick={() => {
                  if (!newBatch.trim()) return;
                  if (config.batches.includes(newBatch.trim())) {
                    showToast(`Batch "${newBatch.trim()}" already exists.`, "warning");
                    return;
                  }
                  const next = [...config.batches, newBatch.trim()];
                  onSaveConfig({ ...config, batches: next });
                  setNewBatch("");
                  showToast(`Added batch ${newBatch.trim()}`, "success");
                }}
                className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold"
              >
                Add
              </button>
            </div>
          </div>

        </div>
      )}

      {/* Tab 4: Database Backup, Excel Export/Import, Cloud Sync & Audit Report */}
      {adminTab === "backup" && (
        <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm p-6 space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            {/* Box 1: Excel Exports */}
            <div className="p-4 bg-slate-50 dark:bg-slate-800/40 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
              <div className="flex items-center gap-2 text-sm font-bold text-slate-900 dark:text-white">
                <Icon name="download" size={18} className="text-emerald-600" />
                <span>Executive Excel (.xlsx) Reports</span>
              </div>
              <p className="text-xs text-slate-500">
                Export styled workbooks with pastel headers for meetings, audits, or offline record-keeping.
              </p>
              <div className="space-y-2 pt-1">
                <button
                  onClick={() => exportCurrentViewExcel(activities, currentLogs, context, headerMetrics)}
                  className="w-full py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 hover:border-emerald-500 rounded-xl text-xs font-semibold text-slate-800 dark:text-slate-200 flex items-center justify-between transition"
                >
                  <span>Export Current Workspace View</span>
                  <span className="text-[10px] text-emerald-600 font-mono font-bold">.XLSX</span>
                </button>
                <button
                  onClick={() => exportFullDatabaseExcel(activities, contexts, config, users)}
                  className="w-full py-2 px-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold flex items-center justify-between shadow transition"
                >
                  <span>Export Entire Multi-College Database (4 Sheets)</span>
                  <span className="text-[10px] text-emerald-100 font-mono font-bold">ALL DATA</span>
                </button>
              </div>
            </div>

            {/* Box 2: JSON Backup & Restore */}
            <div className="p-4 bg-slate-50 dark:bg-slate-800/40 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
              <div className="flex items-center gap-2 text-sm font-bold text-slate-900 dark:text-white">
                <Icon name="database" size={18} className="text-indigo-600" />
                <span>Full JSON Database Backup & Disaster Recovery</span>
              </div>
              <p className="text-xs text-slate-500">
                Download or restore a complete timestamped image of Firestore configuration, user accounts, and all 230-activity logs.
              </p>
              <div className="flex items-center gap-2 pt-1">
                <button
                  onClick={() => downloadJsonBackup({ config, users, activities, contexts })}
                  className="flex-1 py-2 px-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow transition text-center"
                >
                  Download JSON Backup
                </button>
                <label className="flex-1 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 hover:border-indigo-500 text-slate-800 dark:text-slate-200 rounded-xl text-xs font-semibold text-center cursor-pointer transition">
                  Restore from JSON
                  <input
                    type="file"
                    accept=".json"
                    className="hidden"
                    onChange={(e) => {
                      const file = e.target.files?.[0];
                      if (!file) return;
                      restoreJsonBackup(file, (data) => {
                        onRestoreBackup(data);
                        showToast("Database restored successfully!", "success");
                      }, (err) => showToast("Failed to restore: " + err, "error"));
                    }}
                  />
                </label>
              </div>
            </div>
          </div>

          {/* System Settings & Compliance Report */}
          <div className="p-4 bg-slate-50 dark:bg-slate-800/40 rounded-2xl border border-slate-200 dark:border-slate-700 flex flex-wrap items-center justify-between gap-4">
            <div>
              <div className="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                <Icon name="printer" size={18} className="text-indigo-600" />
                <span>Print Official A4 Compliance Audit Report</span>
              </div>
              <p className="text-xs text-slate-500 mt-0.5">
                Renders formal Times New Roman institutional report with sign-off blocks for Assistant, Coordinator, AR Ajay Shelar, Dy. CoE Dr. Rupesh Mundada, and CoE Ms. Alka Shukla.
              </p>
            </div>
            <button
              onClick={onOpenAuditModal}
              className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow flex items-center gap-2"
            >
              <Icon name="printer" size={15} />
              <span>Generate Audit Report</span>
            </button>
          </div>

          {/* Quick-Login Demo Pills Toggle & Seed Reset */}
          <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-4 text-xs">
            <div className="flex items-center gap-3">
              <label className="relative inline-flex items-center cursor-pointer">
                <input
                  type="checkbox"
                  checked={!config.hideDemoLogins}
                  onChange={(e) => onSaveConfig({ ...config, hideDemoLogins: !e.target.checked })}
                  className="sr-only peer"
                />
                <div className="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600" />
              </label>
              <span className="font-semibold text-slate-700 dark:text-slate-300">
                Show Quick-Fill Demo Pills on Login Screen (Testing Mode)
              </span>
            </div>

            <button
              onClick={onResetToSeed}
              className="px-3 py-1.5 text-xs text-red-600 hover:text-red-700 border border-red-200 dark:border-red-900 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-xl transition"
            >
              Reset to Factory Seed Data
            </button>
          </div>
        </div>
      )}

      {/* Add / Edit Staff Modal */}
      {(isAddingUser || editingUser) && (
        <StaffFormModal
          user={editingUser}
          config={config}
          onClose={() => { setEditingUser(null); setIsAddingUser(false); }}
          onSave={(savedUser) => {
            onSaveUser(savedUser);
            setEditingUser(null);
            setIsAddingUser(false);
          }}
        />
      )}

      {/* Add / Edit Activity Modal */}
      {(isAddingAct || editingAct) && (
        <ActivityFormModal
          activity={editingAct}
          phases={activePhases}
          activities={activities}
          onClose={() => { setEditingAct(null); setIsAddingAct(false); }}
          onSave={(savedAct) => {
            onSaveActivity(savedAct);
            setEditingAct(null);
            setIsAddingAct(false);
          }}
        />
      )}
    </div>
  );
}



// --- Staff Form Modal ---
function StaffFormModal({ user, config, onClose, onSave }) {
  const [name, setName] = useState(user?.name || "");
  const [email, setEmail] = useState(user?.email || "");
  const [password, setPassword] = useState(user?.password || "Pass@123");
  const [role, setRole] = useState(user?.role || "ASST");
  const [isAdmin, setIsAdmin] = useState(!!user?.isAdmin);
  const [assignedColleges, setAssignedColleges] = useState(user?.assignedColleges || ["NM"]);
  const [assignedPrograms, setAssignedPrograms] = useState(user?.assignedPrograms || {});
  const [active, setActive] = useState(user?.active !== false);

  const targetColleges = assignedColleges.includes('ALL')
    ? config.colleges.map(c => c.id)
    : assignedColleges;

  const toggleCollege = (colId) => {
    if (assignedColleges.includes(colId)) {
      setAssignedColleges(assignedColleges.filter(c => c !== colId));
    } else {
      setAssignedColleges([...assignedColleges, colId]);
    }
  };

  const toggleCollegeProgAll = (colId, availableProgs) => {
    setAssignedPrograms(prev => {
      const cur = prev[colId] || (prev['ALL']?.includes('ALL') ? ['ALL'] : ['ALL']);
      const next = { ...prev };
      if (cur.includes('ALL')) {
        next[colId] = [...availableProgs];
      } else {
        next[colId] = ['ALL'];
      }
      return next;
    });
  };

  const toggleSpecificProgram = (colId, prog, availableProgs) => {
    setAssignedPrograms(prev => {
      const next = { ...prev };
      let cur = next[colId] || (next['ALL']?.includes('ALL') ? ['ALL'] : ['ALL']);
      if (cur.includes('ALL')) {
        cur = availableProgs.filter(p => p !== prog);
      } else if (cur.includes(prog)) {
        cur = cur.filter(p => p !== prog);
      } else {
        cur = [...cur, prog];
      }
      next[colId] = cur;
      return next;
    });
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!name.trim() || !email.trim()) return;

    const cleanedPrograms = {};
    if (assignedColleges.includes('ALL')) {
      cleanedPrograms['ALL'] = ['ALL'];
      config.colleges.forEach(c => {
        if (assignedPrograms[c.id]) {
          cleanedPrograms[c.id] = assignedPrograms[c.id];
        }
      });
    } else {
      assignedColleges.forEach(colId => {
        cleanedPrograms[colId] = assignedPrograms[colId] || ['ALL'];
      });
    }

    let finalPassword = password.trim() || "Pass@123";
    if (password !== user?.password && !finalPassword.startsWith("sha256:") && !finalPassword.startsWith("fb:")) {
      finalPassword = await hashPassword(finalPassword);
    }

    const savedUser = {
      id: user?.id || `user_${Date.now()}`,
      name: name.trim(),
      email: email.trim(),
      password: finalPassword,
      mustChangePassword: user ? (password !== user.password) : false,
      role,
      isAdmin,
      assignedColleges,
      assignedPrograms: cleanedPrograms,
      active
    };
    onSave(savedUser);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
      <div className="w-full max-w-xl max-h-[90vh] overflow-y-auto bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-800">
        <h3 className="text-sm font-bold text-slate-900 dark:text-white mb-3">
          {user ? `Edit Staff Account: ${user.name}` : "Create New Staff Account"}
        </h3>
        <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
          <div>
            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
            <input
              type="text"
              required
              value={name}
              onChange={(e) => setName(e.target.value)}
              className="w-full px-3 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded-xl"
            />
          </div>

          <div>
            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Email Address (Login Username)</label>
            <input
              type="email"
              required
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              className="w-full px-3 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded-xl"
            />
          </div>

          <div>
            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Password</label>
            <input
              type="text"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              placeholder="e.g. Pass@123"
              className="w-full px-3 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded-xl font-mono"
            />
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Role Hierarchy</label>
              <select
                value={role}
                onChange={(e) => setRole(e.target.value)}
                className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded-xl font-bold"
              >
                <option value="ASST">ASST (Assistant)</option>
                <option value="ASST_COORD">ASST_COORD (Asst. Coordinator)</option>
                <option value="COORD">COORD (Coordinator)</option>
                <option value="AR">AR (Assistant Registrar)</option>
                <option value="DY_COE">DY_COE (Deputy Controller)</option>
                <option value="COE">COE (Controller of Exams)</option>
              </select>
            </div>

            <div>
              <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">System Admin Flag</label>
              <label className="flex items-center gap-2 mt-2 cursor-pointer">
                <input
                  type="checkbox"
                  checked={isAdmin}
                  onChange={(e) => setIsAdmin(e.target.checked)}
                  className="rounded text-indigo-600 focus:ring-indigo-500"
                />
                <span className="font-semibold text-slate-700 dark:text-slate-300">Grant Admin Panel Access</span>
              </label>
            </div>
          </div>

          <div>
            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
              Assigned College Scope:
            </label>
            <div className="flex flex-wrap gap-2 pt-1">
              <label className="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-lg cursor-pointer">
                <input
                  type="checkbox"
                  checked={assignedColleges.includes('ALL')}
                  onChange={() => {
                    if (assignedColleges.includes('ALL')) setAssignedColleges([]);
                    else setAssignedColleges(['ALL']);
                  }}
                  className="rounded text-indigo-600"
                />
                <span className="font-bold">ALL Colleges</span>
              </label>
              {config.colleges.map(c => (
                <label key={c.id} className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800/60 px-2.5 py-1 rounded-lg cursor-pointer">
                  <input
                    type="checkbox"
                    disabled={assignedColleges.includes('ALL')}
                    checked={assignedColleges.includes(c.id)}
                    onChange={() => toggleCollege(c.id)}
                    className="rounded text-indigo-600"
                  />
                  <span>{c.name}</span>
                </label>
              ))}
            </div>
          </div>

          {/* Granular Per-College Program Assignment */}
          {targetColleges.length > 0 && (
            <div className="space-y-2 pt-2 border-t border-slate-200 dark:border-slate-800">
              <div className="flex items-center justify-between">
                <label className="block font-semibold text-slate-700 dark:text-slate-300">
                  Assigned Programs Scope (Per College):
                </label>
                <span className="text-[10px] text-slate-400">Toggle ALL or pick degree programs</span>
              </div>
              <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                {targetColleges.map(colId => {
                  const colObj = config.colleges.find(c => c.id === colId);
                  const colName = colObj ? colObj.name : colId;
                  const availableProgs = config.programs[colId] || [];
                  const curProgs = assignedPrograms[colId] || (assignedPrograms['ALL']?.includes('ALL') ? ['ALL'] : ['ALL']);
                  const isAll = curProgs.includes('ALL');

                  return (
                    <div key={colId} className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-800/40 space-y-1.5">
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-slate-800 dark:text-slate-200">{colName} ({colId})</span>
                        <label className="flex items-center gap-1.5 text-[11px] font-semibold cursor-pointer text-indigo-600 dark:text-indigo-400">
                          <input
                            type="checkbox"
                            checked={isAll}
                            onChange={() => toggleCollegeProgAll(colId, availableProgs)}
                            className="rounded text-indigo-600 focus:ring-indigo-500"
                          />
                          <span>ALL Programs</span>
                        </label>
                      </div>
                      {!isAll && (
                        <div className="flex flex-wrap gap-1.5 pt-1">
                          {availableProgs.map(prog => {
                            const isChecked = curProgs.includes(prog);
                            return (
                              <label key={prog} className={`flex items-center gap-1 px-2 py-0.5 rounded-lg border text-[11px] cursor-pointer transition ${
                                isChecked
                                  ? 'bg-indigo-50 dark:bg-indigo-900/30 border-indigo-300 dark:border-indigo-700 text-indigo-700 dark:text-indigo-300 font-semibold'
                                  : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'
                              }`}>
                                <input
                                  type="checkbox"
                                  checked={isChecked}
                                  onChange={() => toggleSpecificProgram(colId, prog, availableProgs)}
                                  className="rounded text-indigo-600 focus:ring-indigo-500 text-[10px]"
                                />
                                <span>{prog}</span>
                              </label>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <div className="flex items-center justify-between pt-2">
            <label className="flex items-center gap-2 cursor-pointer">
              <input
                type="checkbox"
                checked={active}
                onChange={(e) => setActive(e.target.checked)}
                className="rounded text-indigo-600"
              />
              <span className="font-semibold">Active Account</span>
            </label>

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={onClose}
                className="px-3.5 py-1.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100"
              >
                Cancel
              </button>
              <button
                type="submit"
                className="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow"
              >
                Save Staff
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  );
}

// --- Activity Form Modal ---
function ActivityFormModal({ activity, phases, activities = [], onClose, onSave }) {
  const [srNo, setSrNo] = useState(activity?.srNo ?? (activities.length ? (activities.length + 8) : 8));
  const [name, setName] = useState(activity?.name || "");
  const [phase, setPhase] = useState(activity?.phase || (phases && phases.length ? phases[0] : ""));
  const [performedBy, setPerformedBy] = useState(activity?.performedBy || "ASST");
  const [cond, setCond] = useState(activity?.cond || "ALL");
  const [requiredVerifiers, setRequiredVerifiers] = useState(activity?.requiredVerifiers || ["ASST_COORD", "COORD", "AR", "DY_COE", "COE"]);

  const toggleVerifier = (role) => {
    if (requiredVerifiers.includes(role)) {
      setRequiredVerifiers(requiredVerifiers.filter(r => r !== role));
    } else {
      setRequiredVerifiers([...requiredVerifiers, role]);
    }
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    const makerRank = ROLE_RANKS[performedBy] ?? -1;
    const sanitizedVerifiers = requiredVerifiers.filter(role => (ROLE_RANKS[role] ?? -1) > makerRank);
    onSave({
      ...(activity || {}),
      id: activity?.id || `act_${Date.now()}`,
      srNo: parseInt(srNo, 10) || 999,
      name: name.trim(),
      phase,
      performedBy,
      cond,
      requiredVerifiers: sanitizedVerifiers
    });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
      <div className="w-full max-w-lg bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-800">
        <h3 className="text-sm font-bold text-slate-900 dark:text-white mb-3">
          {activity ? `Edit Activity #${activity.srNo}` : "Add New Examination Activity"}
        </h3>
        <form onSubmit={handleSubmit} className="space-y-3.5 text-xs">
          <div className="grid grid-cols-4 gap-3">
            <div className="col-span-1">
              <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Sr. No.</label>
              <input
                type="number"
                required
                min="1"
                value={srNo}
                onChange={(e) => setSrNo(parseInt(e.target.value, 10) || "")}
                className="w-full px-3 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded-xl font-bold"
              />
            </div>
            <div className="col-span-3">
              <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Activity Name</label>
              <input
                type="text"
                required
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="w-full px-3 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded-xl"
              />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Phase</label>
              <select
                value={phase}
                onChange={(e) => setPhase(e.target.value)}
                className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded-xl"
              >
                {(phases || []).map(p => (
                  <option key={p} value={p}>{p}</option>
                ))}
              </select>
            </div>

            <div>
              <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Condition</label>
              <select
                value={cond}
                onChange={(e) => setCond(e.target.value)}
                className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded-xl font-bold"
              >
                <option value="ALL">ALL Semesters</option>
                <option value="EVEN_ONLY">Even Semesters Only</option>
                <option value="FINAL_ONLY">Final Semesters Only</option>
              </select>
            </div>
          </div>

          <div>
            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
              Performed By (Maker Role)
            </label>
            <select
              value={performedBy}
              onChange={(e) => setPerformedBy(e.target.value)}
              className="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-800 border rounded-xl font-bold"
            >
              <option value="ASST">ASST (Assistant)</option>
              <option value="ASST_COORD">ASST_COORD (Assistant Coordinator)</option>
              <option value="COORD">COORD (Coordinator)</option>
              <option value="AR">AR (Assistant Registrar)</option>
            </select>
          </div>

          <div>
            <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
              Required Verification Levels:
            </label>
            <div className="flex flex-wrap gap-2 pt-1">
              {['ASST_COORD', 'COORD', 'AR', 'DY_COE', 'COE'].map(role => {
                const isEligible = (ROLE_RANKS[role] ?? -1) > (ROLE_RANKS[performedBy] ?? -1);
                if (!isEligible) return null;
                return (
                  <label key={role} className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800 px-2.5 py-1 rounded-lg cursor-pointer">
                    <input
                      type="checkbox"
                      checked={requiredVerifiers.includes(role)}
                      onChange={() => toggleVerifier(role)}
                      className="rounded text-indigo-600"
                    />
                    <span>{role}</span>
                  </label>
                );
              })}
            </div>
          </div>

          <div className="flex items-center justify-end gap-2 pt-3">
            <button
              type="button"
              onClick={onClose}
              className="px-3.5 py-1.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100"
            >
              Cancel
            </button>
            <button
              type="submit"
              className="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow"
            >
              Save Activity
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

function AuditReportModal({
  activities,
  currentLogs,
  context,
  headerMetrics,
  users,
  config,
  onClose
}) {
  const [includeFullChecklist, setIncludeFullChecklist] = useState(true);

  const phases = useMemo(() => {
    if (config?.phases && config.phases.length > 0) {
      return config.phases;
    }
    const list = [];
    activities.forEach(a => {
      if (!list.includes(a.phase)) list.push(a.phase);
    });
    return list;
  }, [activities, config?.phases]);

  const phaseBreakdown = useMemo(() => {
    return phases.map(ph => {
      const acts = activities.filter(a => a.phase === ph);
      let done = 0;
      acts.forEach(a => {
        const log = currentLogs[a.id] || {};
        if (computeActivityStatus(a, log, context.semester) === "COMPLETED") done++;
      });
      const pct = acts.length > 0 ? Math.round((done / acts.length) * 100) : 0;
      return { phase: ph, total: acts.length, done, pct };
    });
  }, [phases, activities, currentLogs, context.semester]);

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto bg-black/70 flex justify-center p-2 sm:p-6 print:p-0 print:bg-white">

// --- Root App Component ---
function App() {
  // Theme
  const [theme, setTheme] = useState(() => {
    return localStorage.getItem('svkm_theme') || 'light';
  });

  useEffect(() => {
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    localStorage.setItem('svkm_theme', theme);
  }, [theme]);

  // Master State
  const [config, setConfig] = useState(() => ({
    colleges: INITIAL_COLLEGES,
    programs: INITIAL_PROGRAMS,
    batches: INITIAL_BATCHES,
    phases: INITIAL_PHASES,
    semesters: INITIAL_SEMESTERS,
    examCycles: INITIAL_EXAM_CYCLES,
    hideDemoLogins: false
  }));

  const [users, setUsers] = useState(INITIAL_USERS);
  const [activities, setActivities] = useState(INITIAL_ACTIVITIES);
  const [contexts, setContexts] = useState({});

  // Active User & Views
  const [currentUser, setCurrentUser] = useState(() => {
    try {
      const saved = localStorage.getItem('svkm_active_user');
      return saved ? JSON.parse(saved) : null;
    } catch (e) {
      return null;
    }
  });

  const [activeTab, setActiveTab] = useState("tracker"); // tracker, queue, dashboard, admin
  const [cloudStatus, setCloudStatus] = useState("CHECKING"); // CONNECTED, LOCAL_FALLBACK
  const [lastSyncTime, setLastSyncTime] = useState(null);
  const [syncError, setSyncError] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [confirmState, setConfirmState] = useState(null);

  const showToast = (message, type = "info") => {
    const id = Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    setToasts(prev => [...prev, { id, message, type }]);
    setTimeout(() => {
      setToasts(prev => prev.filter(t => t.id !== id));
    }, 4500);
  };

  const showConfirm = ({ title, message, confirmText = "Confirm", cancelText = "Cancel", type = "danger", onConfirm }) => {
    setConfirmState({
      title,
      message,
      confirmText,
      cancelText,
      type,
      onConfirm: () => {
        setConfirmState(null);
        if (onConfirm) onConfirm();
      },
      onCancel: () => {
        setConfirmState(null);
      }
    });
  };

  useEffect(() => {
    window.showPortalToast = showToast;
  }, []);
  const dbRef = useRef(null);

  // Active Context
  const [context, setContext] = useState({
    college: "NM",
    batch: "2025-26",
    program: "B.Com",
    semester: "Sem I",
    examCycle: "Regular"
  });

  // Modals
  const [showPasswordModal, setShowPasswordModal] = useState(false);
  const [showAuditModal, setShowAuditModal] = useState(false);
  const [showCloudModal, setShowCloudModal] = useState(false);
  const [activeQueryModal, setActiveQueryModal] = useState(null); // { activity, log, ctxKey }

  // Initial Load & Firestore Sync
  useEffect(() => {
    // 1. Try local data first
    const local = StorageService.getLocalData();
    let initialConfig = config;
    let initialUsers = users;
    let initialActivities = activities;
    let initialContexts = contexts;

    if (local) {
      if (local.config) { initialConfig = local.config; setConfig(local.config); }
      if (local.users) { initialUsers = local.users; setUsers(local.users); }
      if (local.activities) { initialActivities = local.activities; setActivities(local.activities); }
      if (local.contexts) { initialContexts = local.contexts; setContexts(local.contexts); }
    }

    // 2. Initialize Firestore
    let unsubscribeSnapshots = null;

    StorageService.initFirebase().then(async (fb) => {
      if (!fb || !fb.db) {
        setCloudStatus("LOCAL_FALLBACK");
        return;
      }
      dbRef.current = fb.db;
      const res = await StorageService.syncFromFirestore(fb.db, {
        config: initialConfig,
        users: initialUsers,
        activities: initialActivities,
        contexts: initialContexts
      });

      if (res.success && res.data) {
        if (res.data.config) setConfig(res.data.config);
        if (res.data.users) setUsers(res.data.users);
        if (res.data.activities) setActivities(res.data.activities);
        if (res.data.contexts) setContexts(res.data.contexts);
        setCloudStatus("CONNECTED");
        setLastSyncTime(new Date());
      } else {
        setCloudStatus("LOCAL_FALLBACK");
      }

      // Real-time Firestore onSnapshot listeners
      unsubscribeSnapshots = StorageService.listenToCloudUpdates(fb.db, {
        onConfigUpdate: (cfg) => {
          if (cfg) {
            setConfig(cfg);
            setCloudStatus("CONNECTED");
            setLastSyncTime(new Date());
            const cur = StorageService.getLocalData() || {};
            StorageService.saveLocalData({ ...cur, config: cfg });
          }
        },
        onUsersUpdate: (usrList) => {
          if (usrList && usrList.length > 0) {
            setUsers(usrList);
            setCloudStatus("CONNECTED");
            setLastSyncTime(new Date());
            setCurrentUser(prevUser => {
              if (!prevUser) return prevUser;
              const match = usrList.find(u => u.id === prevUser.id);
              if (match) {
                localStorage.setItem('svkm_active_user', JSON.stringify(match));
                return match;
              }
              return prevUser;
            });
            const cur = StorageService.getLocalData() || {};
            StorageService.saveLocalData({ ...cur, users: usrList });
          }
        },
        onActivitiesUpdate: (actList) => {
          if (actList && actList.length > 0) {
            setActivities(actList);
            setCloudStatus("CONNECTED");
            setLastSyncTime(new Date());
            const cur = StorageService.getLocalData() || {};
            StorageService.saveLocalData({ ...cur, activities: actList });
          }
        },
        onContextsUpdate: (ctxMap) => {
          if (ctxMap) {
            setContexts(prev => {
              const merged = { ...prev, ...ctxMap };
              const cur = StorageService.getLocalData() || {};
              StorageService.saveLocalData({ ...cur, contexts: merged });
              return merged;
            });
            setCloudStatus("CONNECTED");
            setLastSyncTime(new Date());
          }
        }
      });
    });

    return () => {
      if (typeof unsubscribeSnapshots === 'function') {
        unsubscribeSnapshots();
      }
    };
  }, []);

  // Auto-sync currentUser whenever users array updates (via edits or cloud sync)
  useEffect(() => {
    if (!currentUser) return;
    const match = users.find(u => u.id === currentUser.id);
    if (match) {
      if (match.active === false) {
        handleSignOut();
        showToast("Your account has been deactivated by the Administrator.", "error");
        return;
      }
      if (JSON.stringify(match) !== JSON.stringify(currentUser)) {
        setCurrentUser(match);
        localStorage.setItem('svkm_active_user', JSON.stringify(match));
      }
    }
  }, [users]);

  // When user logs in, ensure their active context is valid for their permissions
  useEffect(() => {
    if (!currentUser) return;
    if (currentUser.mustChangePassword) {
      setShowPasswordModal(true);
    }

    // Check college permission
    const allowedCols = currentUser.isAdmin || ['COE', 'DY_COE'].includes(currentUser.role) || currentUser.assignedColleges?.includes('ALL')
      ? config.colleges.map(c => c.id)
      : currentUser.assignedColleges || [];

    let targetCol = context.college;
    if (allowedCols.length > 0 && !allowedCols.includes(context.college)) {
      targetCol = allowedCols[0];
    }

    // Check program permission for targetCol
    const allProgsForCollege = config.programs[targetCol] || [];
    let allowedProgs = allProgsForCollege;
    if (!currentUser.isAdmin && !['COE', 'DY_COE'].includes(currentUser.role) && !currentUser.assignedColleges?.includes('ALL')) {
      const userCollegeProgs = currentUser.assignedPrograms?.[targetCol];
      if (userCollegeProgs && !userCollegeProgs.includes('ALL')) {
        allowedProgs = allProgsForCollege.filter(p => userCollegeProgs.includes(p));
      }
    }

    let targetProg = context.program;
    if (allowedProgs.length > 0 && (!allowedProgs.includes(targetProg) || targetCol !== context.college)) {
      targetProg = allowedProgs[0] || (allProgsForCollege[0] || "");
    }

    if (targetCol !== context.college || targetProg !== context.program) {
      setContext(prev => ({
        ...prev,
        college: targetCol,
        program: targetProg
      }));
    }
  }, [currentUser, config.colleges, config.programs]);

  // Current Context Key & Data
  const currentContextKey = useMemo(() => {
    return getContextKey(context.college, context.batch, context.program, context.semester, context.examCycle);

  const currentContextData = useMemo(() => {
    return contexts[currentContextKey] || {

        batch: context.batch,

        totalStudents: 480,
        pwdStudents: 3,
        debarredStudents: 2,
        ufmCases: 1
      },
      logs: {}
    };
  }, [contexts, currentContextKey, context.batch]);

  const currentLogs = currentContextData.logs || {};
  const currentHeaderMetrics = currentContextData.headerMetrics || {};

  // Persistence Helper
  // Persist Context Data with atomic cloud updates & functional state
  const persistSpecificContextData = (ctxKey, updatedContextData, optActId, optLogData, optRevokeRole, optRevokeHistory, optBulkMap) => {
    setContexts(prev => {
      const nextContexts = {
        ...prev,
        [ctxKey]: updatedContextData
      };
      StorageService.saveLocalData({ config, users, activities, contexts: nextContexts });
      return nextContexts;
    });

    if (dbRef.current) {
      if (optRevokeRole) {
        StorageService.revokeVerificationInCloud(dbRef.current, ctxKey, optActId, optRevokeRole, optRevokeHistory)
          .catch(err => {
            console.warn("Cloud write error:", err);
            setSyncError(true);
          });
      } else if (optActId && optLogData) {
        StorageService.saveActivityLogToCloud(dbRef.current, ctxKey, optActId, optLogData, updatedContextData.headerMetrics)
          .catch(err => {
            console.warn("Cloud write error:", err);
            setSyncError(true);
          });
      } else if (optBulkMap) {
        StorageService.saveBulkActivityLogsToCloud(dbRef.current, ctxKey, optBulkMap)
          .catch(err => {
            console.warn("Cloud write error:", err);
            setSyncError(true);
          });
      } else {
        StorageService.saveContextToCloud(dbRef.current, ctxKey, updatedContextData)
          .catch(err => {
            console.warn("Cloud write error:", err);
            setSyncError(true);
          });

  };

  const persistContextData = (updatedContextData) => {
    persistSpecificContextData(currentContextKey, updatedContextData);
  };

  // Update single log with auto Exam Month & Year derivation
  const handleUpdateLog = (activityId, logData) => {
    let nextMetrics = currentHeaderMetrics;
    if (activityId === "act_23" || activityId === "act_135") {
      if (logData?.performedDate) {
        const m = formatExamMonthYear(logData.performedDate);
        if (m) {
          nextMetrics = { ...currentHeaderMetrics, examMonthYear: m };
        }
      }
    }
    const updated = {
      ...currentContextData,
      headerMetrics: nextMetrics,
      logs: {
        ...currentLogs,
        [activityId]: logData
      }
    };
    persistSpecificContextData(currentContextKey, updated, activityId, logData);
  };

  // Revoke verification handler
  const handleRevokeVerification = (activityId, role, updatedHistory) => {
    const curLog = currentLogs[activityId] || {};
    const nextVerifs = { ...(curLog.verifications || {}) };
    delete nextVerifs[role];
    const updatedLog = {
      ...curLog,
      verifications: nextVerifs,
      history: updatedHistory
    };
    const updatedCtx = {
      ...currentContextData,
      logs: {
        ...currentLogs,
        [activityId]: updatedLog
      }
    };
    persistSpecificContextData(currentContextKey, updatedCtx, activityId, null, role, updatedHistory);
    showToast(`Verification for tier ${role} revoked.`, "info");
  };

  // Bulk update logs
  const handleBulkUpdateLogs = (updates) => {
    const updated = {
      ...currentContextData,
      logs: {
        ...currentLogs,
        ...updates
      }
    };
    persistSpecificContextData(currentContextKey, updated, null, null, null, null, updates);
    showToast("Bulk actions applied successfully.", "success");
  };

  // Update Header Metrics explicitly via saveHeaderMetricsToCloud
  const handleUpdateMetrics = (metrics) => {
    const updated = {
      ...currentContextData,
      headerMetrics: metrics
    };
    setContexts(prev => {
      const nextContexts = {
        ...prev,
        [currentContextKey]: updated
      };
      StorageService.saveLocalData({ config, users, activities, contexts: nextContexts });
      return nextContexts;
    });
    if (dbRef.current) {
      StorageService.saveHeaderMetricsToCloud(dbRef.current, currentContextKey, metrics)
        .catch(err => {
          console.warn("Cloud write error:", err);
          setSyncError(true);
        });
    }
  };

  // Direct perform from Action Queue
  const handleDirectPerform = (ctxKey, actId, dateVal) => {
    const targetCtx = contexts[ctxKey] || { headerMetrics: {}, logs: {} };
    const curLog = targetCtx.logs?.[actId] || {};
    const act = activities.find(a => a.id === actId);
    let nextMetrics = targetCtx.headerMetrics || {};
    if (actId === "act_23" || actId === "act_135") {
      const m = formatExamMonthYear(dateVal);
      if (m) nextMetrics = { ...nextMetrics, examMonthYear: m };
    }
    const historyEntry = {
      id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      action: "PERFORMED",
      role: currentUser.role,
      userName: currentUser.name,
      userEmail: currentUser.email,
      dateValue: dateVal,
      details: "Performed via Action Queue",
      timestamp: new Date().toISOString()
    };
    const logData = {
      ...curLog,
      performedDate: dateVal,
      performedByUser: {
        name: currentUser.name,
        email: currentUser.email,
        timestamp: new Date().toISOString()
      },
      history: [...(curLog.history || []), historyEntry]
    };
    const updated = {
      ...targetCtx,
      headerMetrics: nextMetrics,
      logs: {
        ...(targetCtx.logs || {}),
        [actId]: logData
      }
    };
    persistSpecificContextData(ctxKey, updated, actId, logData);
    showToast(`Activity #${act?.srNo || ''} performed successfully.`, "success");

  // Direct verify from Action Queue
  const handleDirectVerify = (ctxKey, actId, role, dateVal) => {

    const curLog = targetCtx.logs?.[actId] || {};
    const act = activities.find(a => a.id === actId);
    const historyEntry = {
      id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      action: "VERIFIED",
      role: role,

      userEmail: currentUser.email,

      details: `Verified tier ${role} via Action Queue`,
      timestamp: new Date().toISOString()
    };
    const logData = {
      ...curLog,
      verifications: {
        ...(curLog.verifications || {}),

        }
      },

    const updated = {

      logs: {
        ...(targetCtx.logs || {}),
        [actId]: logData
      }
    };
    persistSpecificContextData(ctxKey, updated, actId, logData);

  const handleSaveQuery = (actId, reason) => {

    const historyEntry = {

      action: "QUERY_RAISED",
      role: currentUser.role,

    };
    const logData = {
      ...curLog,
      queryDetails: {

        role: currentUser.role,
        email: currentUser.email,

        timestamp: new Date().toISOString(),

      history: [...(curLog.history || []), historyEntry]

    const updated = {
      ...targetCtx,
      logs: {
        ...(targetCtx.logs || {}),
        [actId]: logData

    persistSpecificContextData(targetKey, updated, actId, logData);

  const handleResolveQuery = (actId, resolutionNotes) => {

    const targetCtx = contexts[targetKey] || (targetKey === currentContextKey ? currentContextData : { headerMetrics: {}, logs: {} });
    const curLog = targetCtx.logs?.[actId] || {};
    const historyEntry = {
      id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      action: "QUERY_RESOLVED",
      role: currentUser.role,
      userName: currentUser.name,
      userEmail: currentUser.email,
      dateValue: null,
      details: `Query resolved: "${resolutionNotes}"`,
      timestamp: new Date().toISOString()
    };
    const logData = {
      ...curLog,
      queryDetails: {
        ...(curLog.queryDetails || {}),
        resolved: true,
        resolvedBy: currentUser.name,
        resolvedAt: new Date().toISOString(),
        resolutionNotes
      },
      history: [...(curLog.history || []), historyEntry]
    };
    const updated = {
      ...targetCtx,
      logs: {
        ...(targetCtx.logs || {}),
        [actId]: logData
      }
    };
    persistSpecificContextData(targetKey, updated, actId, logData);
    showToast("Query marked as resolved.", "success");
  };

  // User auth handlers
  const handleLogin = (user) => {
    setCurrentUser(user);
    localStorage.setItem('svkm_active_user', JSON.stringify(user));
  };

  const handleSignOut = () => {
    setCurrentUser(null);
    localStorage.removeItem('svkm_active_user');
  };

  const handleSavePassword = (newPassword) => {
    const updatedUser = {
      ...currentUser,
      password: newPassword,
      mustChangePassword: false
    };
    const nextUsers = users.map(u => u.id === updatedUser.id ? updatedUser : u);
    setUsers(nextUsers);
    setCurrentUser(updatedUser);
    localStorage.setItem('svkm_active_user', JSON.stringify(updatedUser));
    StorageService.saveLocalData({ config, users: nextUsers, activities, contexts });
    StorageService.saveUserToCloud(dbRef.current, updatedUser);
    setShowPasswordModal(false);
    showToast("Password updated successfully!", "success");
  };

  // Admin User operations
  const handleSaveStaffUser = (savedUser) => {
    const exists = users.some(u => u.id === savedUser.id);
    const nextUsers = exists ? users.map(u => u.id === savedUser.id ? savedUser : u) : [...users, savedUser];
    setUsers(nextUsers);
    if (currentUser && currentUser.id === savedUser.id) {
      setCurrentUser(savedUser);
      localStorage.setItem('svkm_active_user', JSON.stringify(savedUser));
    }
    StorageService.saveLocalData({ config, users: nextUsers, activities, contexts });
    StorageService.saveUserToCloud(dbRef.current, savedUser);
  };

  const handleDeleteStaffUser = (userId) => {
    if (userId === currentUser.id) {
      showToast("You cannot delete your currently active account.", "warning");
      return;
    }
    showConfirm({
      title: "Delete Staff Account",
      message: "Are you sure you want to delete this staff account?",
      type: "danger",
      onConfirm: () => {
        const nextUsers = users.filter(u => u.id !== userId);
        setUsers(nextUsers);
        StorageService.saveLocalData({ config, users: nextUsers, activities, contexts });
        StorageService.deleteUserFromCloud(dbRef.current, userId);
        showToast("Staff account deleted successfully.", "info");
      }
    });
  };

  const handleResetPassword = (userId) => {
    const target = users.find(u => u.id === userId);
    if (!target) return;
    const updated = { ...target, password: "Pass@123", mustChangePassword: true };
    handleSaveStaffUser(updated);
    showToast(`Password for ${target.name} reset to Pass@123`, "success");
  };

  // Admin Activity operations
  const handleSaveActivity = (savedAct) => {
    const exists = activities.some(a => a.id === savedAct.id);
    const nextActs = exists ? activities.map(a => a.id === savedAct.id ? savedAct : a) : [...activities, savedAct];
    nextActs.sort((a, b) => (a.srNo || 0) - (b.srNo || 0));
    setActivities(nextActs);
    StorageService.saveLocalData({ config, users, activities: nextActs, contexts });
    StorageService.saveActivitiesToCloud(dbRef.current, nextActs);
  };

  const handleDeleteActivity = (actId) => {
    const nextActs = activities.filter(a => a.id !== actId);
    setActivities(nextActs);
    StorageService.saveLocalData({ config, users, activities: nextActs, contexts });
    StorageService.saveActivitiesToCloud(dbRef.current, nextActs);
  };

  // Admin Config operations
  const handleSaveConfig = (nextConfig) => {
    setConfig(nextConfig);
    StorageService.saveLocalData({ config: nextConfig, users, activities, contexts });
    StorageService.saveConfigToCloud(dbRef.current, nextConfig);
  };

  // Full restore
  const handleRestoreBackup = (data) => {
    setConfig(data.config);
    setUsers(data.users);
    setActivities(data.activities);
    setContexts(data.contexts || {});
    StorageService.saveLocalData(data);
    if (dbRef.current) {
      StorageService.saveConfigToCloud(dbRef.current, data.config);
      StorageService.saveActivitiesToCloud(dbRef.current, data.activities);
      for (const u of data.users) {
        StorageService.saveUserToCloud(dbRef.current, u);
      }
      Object.entries(data.contexts || {}).forEach(([k, v]) => {

      });
    }
  };

  const handleResetToSeed = () => {
    showConfirm({

      message: "Reset all portal data to initial factory seed? This will overwrite local modifications and restore default staff accounts.",
      type: "danger",
      onConfirm: () => {
        const seed = {
          config: {
