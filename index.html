function formatExamMonthYear(dateStr) {
  if (!dateStr || typeof dateStr !== 'string') return "";
  const parts = dateStr.trim().split('-');
  if (parts.length === 3 && parts[0].length === 4) {
    const year = parts[0];
    const monthIdx = parseInt(parts[1], 10) - 1;
    const months = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];
    if (monthIdx >= 0 && monthIdx < 12) {
      return `${months[monthIdx]}, ${year}`;
    }
  }
  return dateStr;
}

async function hashPassword(plainText) {
  if (!plainText) return "";
  try {
    if (window.crypto && window.crypto.subtle && window.crypto.subtle.digest) {
      const msgUint8 = new TextEncoder().encode(plainText);
      const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return "sha256:" + hashHex;
    }
  } catch (e) {
    console.warn("crypto.subtle not available, using fallback hash", e);
  }
  // Deterministic fallback for non-HTTPS file:// testing
  let hash = 0x811c9dc5;
  for (let i = 0; i < plainText.length; i++) {
    hash ^= plainText.charCodeAt(i);
    hash += (hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
  }
  return "fb:" + (hash >>> 0).toString(16);
}

async function verifyPassword(inputPassword, storedPasswordOrHash) {
  if (!inputPassword || !storedPasswordOrHash) return false;
  if (storedPasswordOrHash === inputPassword) return true;
  const hashedInput = await hashPassword(inputPassword);
  return hashedInput === storedPasswordOrHash;
}

function computeUserActionableItems(activities, contextsMap, config, currentUser) {
  if (!currentUser || !contextsMap || !activities) return [];
  const list = [];
  const role = currentUser.role;
  const isAdmin = !!currentUser.isAdmin;

  const accessibleColleges = isAdmin || ['COE', 'DY_COE'].includes(role) || currentUser.assignedColleges?.includes('ALL')
    ? (config?.colleges || []).map(c => c.id)
    : (currentUser.assignedColleges || []);

  Object.entries(contextsMap).forEach(([ctxKey, ctxData]) => {
    const parts = ctxKey.split('__');
    if (parts.length < 5) return;
    const [colId, batch, progId, sem, cycle] = parts;

    if (!accessibleColleges.includes(colId)) return;

    if (!isAdmin && !['COE', 'DY_COE'].includes(role) && !currentUser.assignedColleges?.includes('ALL')) {
      const userProgs = currentUser.assignedPrograms?.[colId];
      if (userProgs && !userProgs.includes('ALL') && !userProgs.includes(progId)) return;
    }

    const logs = ctxData?.logs || {};

    activities.forEach(act => {
      const log = logs[act.id] || {};
      if (log.isNA) return;

      if (act.cond === "EVEN_ONLY" && !["Sem II", "Sem IV", "Sem VI", "Sem VIII"].includes(sem)) return;
      if (act.cond === "FINAL_ONLY" && !["Sem VI", "Sem VIII"].includes(sem)) return;

      // 1. Active Query
      if (log.queryDetails && !log.queryDetails.resolved) {
        if (act.performedBy === role || isAdmin) {
          list.push({
            id: `${ctxKey}__${act.id}`,
            ctxKey,
            college: colId,
            batch,
            program: progId,
            semester: sem,
            examCycle: cycle,
            activity: act,
            log,
            actionType: "QUERY_RESOLVE",
            actionLabel: "Resolve Query",
            priority: 1
          });
          return;
        }
      }

      // 2. Maker Action
      if (!log.performedDate) {
        if (act.performedBy === role || isAdmin) {
          list.push({
            id: `${ctxKey}__${act.id}`,
            ctxKey,
            college: colId,
            batch,
            program: progId,
            semester: sem,
            examCycle: cycle,
            activity: act,
            log,
            actionType: "PERFORM",
            actionLabel: `Perform (${act.performedBy})`,
            priority: 2
          });
          return;
        }
      }

      // 3. Verifier Action
      const makerRank = ROLE_RANKS[act.performedBy] ?? -1;
      const reqs = (act.requiredVerifiers || []).filter(r => (ROLE_RANKS[r] ?? -1) > makerRank);
      if (reqs.includes(role)) {
        const idx = reqs.indexOf(role);
        const prevDone = idx === 0 || !!log.verifications?.[reqs[idx - 1]]?.verified;
        if (prevDone && !log.verifications?.[role]?.verified) {
          list.push({
            id: `${ctxKey}__${act.id}`,
            ctxKey,
            college: colId,
            batch,
            program: progId,
            semester: sem,
            examCycle: cycle,
            activity: act,
            log,
            verifyRole: role,
            actionType: "VERIFY",
            actionLabel: `Verify (${role})`,
            priority: 3
          });
        }
      }
    });
  });

  return list.sort((a, b) => a.priority - b.priority);
}

function computeActivityStatus(activity, log, semester) {
  if (log?.isNA) return "NA";
  if (activity.cond === "EVEN_ONLY" && !["Sem II", "Sem IV", "Sem VI", "Sem VIII"].includes(semester)) {
    return "SKIPPED";
  }
  if (activity.cond === "FINAL_ONLY" && !["Sem VI", "Sem VIII"].includes(semester)) {
    return "SKIPPED";
  }
  if (log?.queryDetails && !log.queryDetails.resolved) {
    return "QUERY_RAISED";
  }
  if (!log?.performedDate) {
    return "PENDING";
  }
  const makerRank = ROLE_RANKS[activity.performedBy] ?? -1;
  const rawReqVerifiers = activity.requiredVerifiers || [];
  const reqVerifiers = rawReqVerifiers.filter(role => (ROLE_RANKS[role] ?? -1) > makerRank);
  if (reqVerifiers.length === 0) return "COMPLETED";
  const allVerified = reqVerifiers.every(role => log?.verifications?.[role]?.verified);
  return allVerified ? "COMPLETED" : "IN_PROGRESS";
}

// --- Storage & Sync Layer ---
class StorageService {
  static LOCAL_KEY = 'svkm_exam_portal_v1';

  static getLocalData() {
    try {
      const raw = localStorage.getItem(this.LOCAL_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {
      console.warn("Error reading localStorage:", e);
    }
    return null;
  }

  static saveLocalData(data) {
    try {
      localStorage.setItem(this.LOCAL_KEY, JSON.stringify(data));
    } catch (e) {
      console.error("Error saving to localStorage:", e);
    }
  }

  static async initFirebase() {
    if (!window.firebase) {
      console.warn("Firebase SDK not detected.");
      return null;
    }
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
      }
      const auth = firebase.auth();
      const db = firebase.firestore();
      
      // Anonymous auth
      try {
        await auth.signInAnonymously();
      } catch (authErr) {
        console.warn("Anonymous auth failed (continuing with Firestore):", authErr.message);
      }

      return { db, auth };
    } catch (e) {
      console.warn("Firebase initialization error:", e);
      return null;
    }
  }

  static async syncFromFirestore(db, localData) {
    if (!db) return { success: false, data: localData };
    try {
      // 1. Config
      let config = localData.config;
      try {
        const configDoc = await db.collection('exam_portal_config').doc('master_data').get();
        if (configDoc.exists) {
          config = configDoc.data();
        } else {
          await db.collection('exam_portal_config').doc('master_data').set(config);
        }
      } catch (err) {
        console.warn("Firestore config read error:", err);
      }

      // 2. Users
      let users = localData.users;
      try {
        const usersSnap = await db.collection('exam_portal_users').get();
        if (!usersSnap.empty) {
          users = usersSnap.docs.map(d => d.data());
        } else {
          // seed users
          for (const u of users) {
            await db.collection('exam_portal_users').doc(u.id).set(u);
          }
        }
      } catch (err) {
        console.warn("Firestore users read error:", err);
      }

      // 3. Activities
      let activities = localData.activities;
      try {
        const actDoc = await db.collection('exam_portal_activities').doc('master_list').get();
        if (actDoc.exists && actDoc.data().activities) {
          activities = actDoc.data().activities;
        } else {
          await db.collection('exam_portal_activities').doc('master_list').set({ activities });
        }
      } catch (err) {
        console.warn("Firestore activities read error:", err);
      }

      // 4. Contexts
      let contexts = localData.contexts || {};
      try {
        const ctxSnap = await db.collection('exam_portal_contexts').get();
        if (!ctxSnap.empty) {
          ctxSnap.forEach(d => {
            contexts[d.id] = d.data();
          });
        }
      } catch (err) {
        console.warn("Firestore contexts read error:", err);
      }

      const merged = { config, users, activities, contexts };
      this.saveLocalData(merged);
      return { success: true, data: merged };
    } catch (globalErr) {
      console.warn("Firestore sync global error:", globalErr);
      return { success: false, data: localData };
    }
  }

  static async saveContextToCloud(db, contextKey, contextData) {
    if (!db) return;
    try {
      await db.collection('exam_portal_contexts').doc(contextKey).set(contextData);
    } catch (e) {
      console.warn("Failed to save context to Firestore:", e);
      throw e;
    }
  }

  static async saveActivityLogToCloud(db, contextKey, activityId, logData, headerMetrics) {
    if (!db) return;
    const docRef = db.collection('exam_portal_contexts').doc(contextKey);
    const payload = {
      logs: {
        [activityId]: logData
      }
    };
    if (headerMetrics) {
      payload.headerMetrics = headerMetrics;
    }
    await docRef.set(payload, { merge: true });
  }

  static async revokeVerificationInCloud(db, contextKey, activityId, revokedRole, updatedHistory) {
    if (!db) return;
    const docRef = db.collection('exam_portal_contexts').doc(contextKey);
    const updatePayload = {
      [`logs.${activityId}.verifications.${revokedRole}`]: firebase.firestore.FieldValue.delete()
    };
    if (updatedHistory) {
      updatePayload[`logs.${activityId}.history`] = updatedHistory;
    }
    await docRef.update(updatePayload);
  }

  static async saveBulkActivityLogsToCloud(db, contextKey, updatesMap) {
    if (!db) return;
    const docRef = db.collection('exam_portal_contexts').doc(contextKey);
    await docRef.set({ logs: updatesMap }, { merge: true });
  }

  static async saveHeaderMetricsToCloud(db, contextKey, headerMetrics) {
    if (!db) return;
    const docRef = db.collection('exam_portal_contexts').doc(contextKey);
    await docRef.set({ headerMetrics }, { merge: true });
  }

  static async deleteContextFromCloud(db, contextKey) {
    if (!db) return;
    try {
      await db.collection('exam_portal_contexts').doc(contextKey).delete();
    } catch(e) {
      console.warn("Failed to delete context document:", e);
    }
  }

  static listenToCloudUpdates(db, callbacks = {}) {
    if (!db) return () => {};
    const unsubs = [];
    try {
      // 1. Config
      const unsubConfig = db.collection('exam_portal_config').doc('master_data')
        .onSnapshot((doc) => {
          if (doc.exists && callbacks.onConfigUpdate) {
            callbacks.onConfigUpdate(doc.data());
          }
        }, (err) => console.warn("Firestore config listener error:", err));
      unsubs.push(unsubConfig);

      // 2. Users
      const unsubUsers = db.collection('exam_portal_users')
        .onSnapshot((snap) => {
          if (!snap.empty && callbacks.onUsersUpdate) {
            const users = snap.docs.map(d => d.data());
            callbacks.onUsersUpdate(users);
          }
        }, (err) => console.warn("Firestore users listener error:", err));
      unsubs.push(unsubUsers);

      // 3. Activities
      const unsubActs = db.collection('exam_portal_activities').doc('master_list')
        .onSnapshot((doc) => {
          if (doc.exists && doc.data()?.activities && callbacks.onActivitiesUpdate) {
            callbacks.onActivitiesUpdate(doc.data().activities);
          }
        }, (err) => console.warn("Firestore activities listener error:", err));
      unsubs.push(unsubActs);

      // 4. Contexts
      const unsubCtx = db.collection('exam_portal_contexts')
        .onSnapshot((snap) => {
          if (callbacks.onContextsUpdate) {
            const contexts = {};
            snap.forEach(d => {
              contexts[d.id] = d.data();
            });
            callbacks.onContextsUpdate(contexts);
          }
        }, (err) => console.warn("Firestore contexts listener error:", err));
      unsubs.push(unsubCtx);
    } catch (err) {
      console.warn("Error attaching Firestore listeners:", err);
    }

    return () => {
      unsubs.forEach(unsub => {
        try { if (typeof unsub === 'function') unsub(); } catch (e) {}
      });
    };
  }

  static async saveUserToCloud(db, user) {
    if (!db) return;
    try {
      await db.collection('exam_portal_users').doc(user.id).set(user, { merge: true });
    } catch (e) {
      console.warn("Failed to save user to Firestore:", e);
    }
  }

  static async deleteUserFromCloud(db, userId) {
    if (!db) return;
    try {
      await db.collection('exam_portal_users').doc(userId).delete();
    } catch (e) {
      console.warn("Failed to delete user from Firestore:", e);
    }
  }

  static async saveConfigToCloud(db, config) {
    if (!db) return;
    try {
      await db.collection('exam_portal_config').doc('master_data').set(config, { merge: true });
    } catch (e) {
      console.warn("Failed to save config to Firestore:", e);
    }
  }

  static async saveActivitiesToCloud(db, activities) {
    if (!db) return;
    try {
      await db.collection('exam_portal_activities').doc('master_list').set({ activities });
    } catch (e) {
      console.warn("Failed to save activities to Firestore:", e);
    }
  }
}

function exportCurrentViewExcel(activities, currentLogs, context, headerMetrics) {
  if (!window.XLSX) {
    if (window.showPortalToast) window.showPortalToast("SheetJS library is still loading. Please try again in a moment.", "warning");
    return;
  }

  const rows = [];
  // Context metadata block
  rows.push(["SVKM'S CONTROLLER OF EXAMINATIONS DIVISION (CED)"]);
  rows.push(["EXAMINATION ACTIVITY TRACKER & VERIFICATION REPORT"]);
  rows.push(["College:", context.college, "Batch (Academic Year):", context.batch]);
  rows.push(["Program:", context.program, "Semester:", context.semester, "Cycle:", context.examCycle]);
  rows.push(["Export Timestamp:", new Date().toLocaleString()]);
  rows.push([]);

  // Session Summary Metrics
  rows.push(["SESSION METADATA SUMMARY"]);
  rows.push([
    "Exam Month & Year", headerMetrics.examMonthYear || formatExamMonthYear(currentLogs["act_23"]?.performedDate || currentLogs["act_135"]?.performedDate) || "N/A",
    "Total Students", headerMetrics.totalStudents || 0,
    "PWD Students", headerMetrics.pwdStudents || 0,
    "Debarred Students", headerMetrics.debarredStudents || 0,
    "UFM Cases Pending", headerMetrics.ufmCases || 0,
    "Modules (WRIT)", headerMetrics.numModules || 0
  ]);
  rows.push([]);

  // Table Headers
  rows.push([
    "Sr. No.",
    "Phase",
    "Activity Name",
    "Maker Role",
    "Condition",
    "Applicable",
    "Status",
    "Performed Date",
    "Performed By",
    "Value / Timing",
    "Remarks",
    "ASST_COORD Verified",
    "ASST_COORD Sign-off",
    "COORD Verified",
    "COORD Sign-off",
    "AR Verified",
    "AR Sign-off",
    "DY_COE Verified",
    "DY_COE Sign-off",
    "COE Verified",
    "COE Sign-off"
  ]);

  activities.forEach(act => {
    const log = currentLogs[act.id] || {};
    const status = computeActivityStatus(act, log, context.semester);

    const getVerifText = (role) => {
      const v = log.verifications?.[role];
      if (!v || !v.verified) return "No";
      return `Yes (${formatDateDisplay(v.date)} - ${v.userName || 'Verified'})`;
    };

    rows.push([
      act.srNo,
      act.phase,
      act.name,
      act.performedBy,
      act.cond,
      log.isNA ? "N/A" : "Applicable",
      status,
      log.performedDate ? formatDateDisplay(log.performedDate) : "",
      log.performedByUser?.name || "",
      log.metricValue || "",
      log.remarks || "",
      log.verifications?.ASST_COORD?.verified ? "YES" : "NO",
      getVerifText('ASST_COORD'),
      log.verifications?.COORD?.verified ? "YES" : "NO",
      getVerifText('COORD'),
      log.verifications?.AR?.verified ? "YES" : "NO",
      getVerifText('AR'),
      log.verifications?.DY_COE?.verified ? "YES" : "NO",
      getVerifText('DY_COE'),
      log.verifications?.COE?.verified ? "YES" : "NO",
      getVerifText('COE')
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Current_View");
  
  const cleanFilename = `SVKM_Exam_Tracker_${context.college}_${context.program.replace(/[^a-zA-Z0-9]/g, '_')}_${context.semester}_${context.examCycle.replace(/[^a-zA-Z0-9]/g, '_')}.xlsx`;
  XLSX.writeFile(wb, cleanFilename);
}

function exportFullDatabaseExcel(activities, contexts, config, users) {
  if (!window.XLSX) {
    if (window.showPortalToast) window.showPortalToast("SheetJS library is still loading. Please try again in a moment.", "warning");
    return;
  }

  const wb = XLSX.utils.book_new();

  // Sheet 1: Activity_Logs
  const logRows = [
    [
      "Context Key", "College", "Batch", "Program", "Semester", "Exam Cycle",
      "Sr. No.", "Activity Name", "Phase", "Maker Role", "Status",
      "Performed Date", "Performed By", "Value/Timing", "Remarks",
      "ASST_COORD Verified", "COORD Verified", "AR Verified", "DY_COE Verified", "COE Verified"
    ]
  ];

  Object.entries(contexts).forEach(([ctxKey, ctxData]) => {
    const parts = ctxKey.split('__');
    const [cCollege, cBatch, cProgram, cSem, cCycle] = parts;
    const logs = ctxData.logs || {};

    activities.forEach(act => {
      const log = logs[act.id];
      if (log && (log.performedDate || log.isNA || log.remarks || Object.keys(log.verifications || {}).length > 0)) {
        logRows.push([
          ctxKey, cCollege, cBatch, cProgram, cSem, cCycle,
          act.srNo, act.name, act.phase, act.performedBy,
          computeActivityStatus(act, log, cSem),
          log.performedDate || "",
          log.performedByUser?.name || "",
          log.metricValue || "",
          log.remarks || "",
          log.verifications?.ASST_COORD?.verified ? log.verifications.ASST_COORD.date : "NO",
          log.verifications?.COORD?.verified ? log.verifications.COORD.date : "NO",
          log.verifications?.AR?.verified ? log.verifications.AR.date : "NO",
          log.verifications?.DY_COE?.verified ? log.verifications.DY_COE.date : "NO",
          log.verifications?.COE?.verified ? log.verifications.COE.date : "NO"
        ]);
      }
    });
  });

  const wsLogs = XLSX.utils.aoa_to_sheet(logRows);
  XLSX.utils.book_append_sheet(wb, wsLogs, "Activity_Logs");

  // Sheet 2: Header_Metrics
  const metricRows = [
    ["Context Key", "College", "Batch", "Exam Month & Year", "Program", "Semester", "Exam Cycle", "Total Students", "PWD Students", "Debarred Students", "UFM Cases", "Modules (WRIT)"]
  ];
  Object.entries(contexts).forEach(([ctxKey, ctxData]) => {
    const parts = ctxKey.split('__');
    const [cCollege, cBatch, cProgram, cSem, cCycle] = parts;
    const m = ctxData.headerMetrics || {};
    metricRows.push([
      ctxKey, cCollege, cBatch,
      m.examMonthYear || "",
      cProgram, cSem, cCycle,
      m.totalStudents || 0,
      m.pwdStudents || 0,
      m.debarredStudents || 0,
      m.ufmCases || 0,
      m.numModules || 0
    ]);
  });
  const wsMetrics = XLSX.utils.aoa_to_sheet(metricRows);
  XLSX.utils.book_append_sheet(wb, wsMetrics, "Header_Metrics");

  // Sheet 3: Master_Activities
  const actRows = [
    ["Sr. No.", "Activity Name", "Phase", "Maker Role", "Condition Rule", "Required Verifiers"]
  ];
  activities.forEach(act => {
    actRows.push([
      act.srNo, act.name, act.phase, act.performedBy, act.cond,
      (act.requiredVerifiers || []).join(', ')
    ]);
  });
  const wsActs = XLSX.utils.aoa_to_sheet(actRows);
  XLSX.utils.book_append_sheet(wb, wsActs, "Master_Activities");

  // Sheet 4: Staff_Directory
  const staffRows = [
    ["User ID", "Name", "Email", "Role", "Is Admin", "Assigned Colleges", "Assigned Programs", "Active"]
  ];
  users.forEach(u => {
    staffRows.push([
      u.id, u.name, u.email, u.role, u.isAdmin ? "YES" : "NO",
      (u.assignedColleges || []).join(', '),
      JSON.stringify(u.assignedPrograms || {}),
      u.active ? "ACTIVE" : "INACTIVE"
    ]);
  });
  const wsStaff = XLSX.utils.aoa_to_sheet(staffRows);
  XLSX.utils.book_append_sheet(wb, wsStaff, "Staff_Directory");

  XLSX.writeFile(wb, `SVKM_Exam_Tracker_MultiCollege_Database_${getTodayYYYYMMDD()}.xlsx`);
}

function downloadJsonBackup(fullData) {
  const blob = new Blob([JSON.stringify(fullData, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `SVKM_Exam_Tracker_Backup_${getTodayYYYYMMDD()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function restoreJsonBackup(file, onSuccess, onError) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.config || !parsed.users || !parsed.activities) {
        throw new Error("Invalid backup structure. Missing essential master keys.");
      }
      onSuccess(parsed);
    } catch (err) {
      onError(err.message);
    }
  };
  reader.onerror = () => onError("Failed to read file.");
  reader.readAsText(file);
}

    </div>
  );
}

// --- Change Password Modal ---
function ChangePasswordModal({ user, onClose, onSave }) {
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");

  const handleSave = (e) => {
    e.preventDefault();
    setError("");
    if (newPassword.length < 6) {
      setError("New password must be at least 6 characters long.");
      return;
    }
    if (newPassword !== confirmPassword) {
      setError("Passwords do not match.");
      return;
    }
    hashPassword(newPassword).then(hashed => {
      onSave(hashed);
    }).catch(err => {
      setError("Error encrypting password.");
    });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
      <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-800">
        <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
          <div className="flex items-center gap-2">
            <div className="p-2 rounded-xl bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300">
              <Icon name="key" size={18} />
            </div>
            <div>
              <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                {user.mustChangePassword ? "Set Personal Password" : "Change Password"}
              </h3>
              <p className="text-xs text-slate-500 dark:text-slate-400">Account: {user.email}</p>
            </div>
          </div>
          {!user.mustChangePassword && (
            <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
              <Icon name="x" size={18} />
            </button>
          )}
        </div>

        {user.mustChangePassword && (
          <div className="mt-3 p-3 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 rounded-xl text-xs text-amber-800 dark:text-amber-200">
            For security reasons, newly initialized accounts must set a secure personal password.
          </div>
        )}

        <form onSubmit={handleSave} className="space-y-3.5 mt-4">
          {error && (
            <div className="p-2.5 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800/60 rounded-xl text-xs text-red-700 dark:text-red-300">
              {error}
            </div>
          )}

          <div>
            <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
              New Password (min 6 characters)
            </label>
            <input
              type="password"
              required
              value={newPassword}
              onChange={(e) => setNewPassword(e.target.value)}
              placeholder="••••••••"
              className="w-full px-3 py-2 text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white"
            />
          </div>

          <div>
            <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
              Confirm New Password
            </label>
            <input
              type="password"
              required
              value={confirmPassword}
              onChange={(e) => setConfirmPassword(e.target.value)}
              placeholder="••••••••"
              className="w-full px-3 py-2 text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white"
            />
          </div>

          <div className="flex items-center justify-end gap-2 pt-2">
            {user.mustChangePassword ? (
              <button
                type="button"
                onClick={onClose}
                className="px-3.5 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl"
              >
                Skip for now (Testing)
              </button>
            ) : (
              <button
                type="button"
                onClick={onClose}
                className="px-3.5 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl"
              >
                Cancel
              </button>
            )}
            <button
              type="submit"
              className="px-4 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow"
            >
              Update Password
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

// --- Query / Flag Modal ---
function QueryModal({ activity, log, currentUser, onClose, onSaveQuery, onResolveQuery }) {
  const [reason, setReason] = useState(log?.queryDetails?.reason || "");
  const [resolutionNotes, setResolutionNotes] = useState("");
  const isExistingQuery = !!(log?.queryDetails && !log.queryDetails.resolved);

  const handleRaise = (e) => {
    e.preventDefault();
    if (!reason.trim()) return;
    onSaveQuery(activity.id, reason.trim());
    onClose();
  };

  const handleResolve = (e) => {
    e.preventDefault();
    onResolveQuery(activity.id, resolutionNotes.trim());
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
      <div className="w-full max-w-lg bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-800">
        <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
          <div className="flex items-center gap-2">
            <div className="p-2 rounded-xl bg-amber-100 text-amber-700 dark:bg-amber-900/60 dark:text-amber-300">
              <Icon name="flag" size={18} />
            </div>
            <div>
              <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                {isExistingQuery ? "Active Verification Query" : "Raise Verification Query / Flag"}
              </h3>
              <p className="text-xs text-slate-500 dark:text-slate-400">
                Activity #{activity.srNo}: {activity.name}
              </p>
            </div>
          </div>
          <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <Icon name="x" size={18} />
          </button>
        </div>

        {isExistingQuery ? (
          <div className="mt-4 space-y-4">
            <div className="p-3.5 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 rounded-xl">
              <div className="flex items-center justify-between text-xs font-semibold text-red-900 dark:text-red-200 mb-1">
                <span>Raised by: {log.queryDetails.raisedBy} ({log.queryDetails.role})</span>
                <span className="text-[10px] text-red-500">{new Date(log.queryDetails.timestamp).toLocaleString()}</span>
              </div>
              <p className="text-xs text-red-800 dark:text-red-300 whitespace-pre-wrap">{log.queryDetails.reason}</p>
            </div>

            <form onSubmit={handleResolve} className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                  Resolution Notes / Action Taken:
                </label>
                <textarea
                  required
                  rows={3}
                  value={resolutionNotes}
                  onChange={(e) => setResolutionNotes(e.target.value)}
                  placeholder="e.g. Corrected the marks report, verified with external examiner..."
                  className="w-full px-3 py-2 text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 text-slate-900 dark:text-white"
                />
              </div>

              <div className="flex items-center justify-end gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3.5 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl"
                >
                  Close
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl shadow flex items-center gap-1.5"
                >
                  <Icon name="check-circle" size={15} />
                  <span>Resolve & Clear Flag</span>
                </button>
              </div>
            </form>
          </div>
        ) : (
          <form onSubmit={handleRaise} className="space-y-4 mt-4">
            <p className="text-xs text-slate-600 dark:text-slate-400">
              Flagging this activity will set its status to <strong className="text-red-600 dark:text-red-400">QUERY_RAISED</strong> and notify the Maker ({activity.performedBy}) to review and resolve the discrepancy.
            </p>

            <div>
              <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
                Query Reason / Instructions for Maker:
              </label>
              <textarea
                required
                rows={4}
                value={reason}
                onChange={(e) => setReason(e.target.value)}
                placeholder="State clearly what is missing or needs correction..."
                className="w-full px-3 py-2 text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-amber-500 text-slate-900 dark:text-white"
              />
            </div>

            <div className="flex items-center justify-end gap-2">
              <button
                type="button"
                onClick={onClose}
                className="px-3.5 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl"
              >
                Cancel
              </button>
              <button
                type="submit"
                className="px-4 py-2 text-xs font-semibold bg-red-600 hover:bg-red-700 text-white rounded-xl shadow flex items-center gap-1.5"
              >
                <Icon name="flag" size={15} />
                <span>Raise Query</span>
              </button>
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

// --- Cloud Connection Details Modal ---

          <div className="flex items-center gap-2">
            <div className="p-2 rounded-xl bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300">
              <Icon name="database" size={18} />
            </div>
            <div>
              <h3 className="text-sm font-bold text-slate-900 dark:text-white">Cloud Database Sync Details</h3>
              <p className="text-xs text-slate-500 dark:text-slate-400">Firebase Firestore v10 + Anonymous Auth</p>

          </div>
          <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <Icon name="x" size={18} />

        <div className="mt-4 space-y-3 text-xs">
          <div className="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-800/50 rounded-xl">

                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />

              </span>
            ) : (
              <span className="font-semibold text-amber-600 dark:text-amber-400 flex items-center gap-1">

            <div className="font-mono text-slate-800 dark:text-slate-200">svkm-exam-tracker</div>
          </div>

          <div className="p-2.5 bg-slate-50 dark:bg-slate-800/50 rounded-xl space-y-1">
            <div className="text-slate-500 font-semibold">Data Synchronization:</div>

              <Icon name="refresh-cw" size={14} />
              <span>Force Re-sync with Cloud</span>

            <button
              onClick={onClose}
              className="px-3.5 py-2 text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl"

              Close

          </div>

// --- Top Navigation Bar ---
function TopNavbar({
  currentUser,
  activeTab,
  setActiveTab,
  theme,
  setTheme,
  cloudStatus,
  syncError,
  onRetrySync,
  actionQueueCount,
  onOpenPasswordModal,
  onOpenAuditModal,
  onOpenCloudModal,
  onSignOut
}) {
  const canViewDashboard = currentUser.isAdmin || ['COE', 'DY_COE', 'AR'].includes(currentUser.role);

  return (
    <header className="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm no-print">
      <div className="max-w-[1700px] mx-auto px-4 py-2.5 flex items-center justify-between gap-4">
        
        {/* Left: Branding & Cloud Pill */}
        <div className="flex items-center gap-3">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
              <Icon name="shield" size={20} />
            </div>
            <div>
              <div className="flex items-center gap-2">
                <span className="font-bold text-slate-900 dark:text-white text-sm tracking-tight uppercase">
                  SVKM's CED
                </span>
                <span className="hidden sm:inline-block px-1.5 py-0.5 rounded text-[10px] font-semibold bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300">
                  COE Portal
                </span>
              </div>
              <div className="text-[11px] text-slate-500 dark:text-slate-400 hidden md:block">
                Examination Activity & Multi-Level Verification
              </div>
            </div>
          </div>

          {/* Cloud Indicator Pill */}
          <button
            onClick={onOpenCloudModal}
            className="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 transition"
            title="Click to view cloud connection & sync status"
          >
            {cloudStatus === 'CONNECTED' ? (
              <>
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                <span className="text-emerald-700 dark:text-emerald-300 font-medium hidden sm:inline">
                  Connected (svkm-exam-tracker)
                </span>
                <span className="text-emerald-700 dark:text-emerald-300 font-medium sm:hidden">

                </span>

                </span>
                <span className="text-amber-700 dark:text-amber-300 font-medium sm:hidden">
                  Fallback
                </span>

          {/* Unsynced / Retry Warning Badge */}

              className="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500 hover:bg-amber-600 text-white shadow-sm transition animate-bounce"

        {/* Center: Main View Tabs */}
        <nav className="flex items-center gap-1 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl">

              activeTab === 'tracker'
                ? 'bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-sm'
                : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'

          >
            <Icon name="layers" size={15} />
            <span>Activity Tracker</span>

          <button
            onClick={() => setActiveTab('queue')}
            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition relative ${
              activeTab === 'queue'
                ? 'bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-sm'
                : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
            }`}
          >
            <Icon name="check-square" size={15} />
            <span>My Action Queue</span>
            {actionQueueCount > 0 && (
              <span className="ml-1 px-1.5 py-0.2 rounded-full text-[10px] font-bold bg-red-600 text-white animate-pulse">

                activeTab === 'dashboard'
                  ? 'bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-sm'
                  : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
              }`}

              <Icon name="bar-chart-3" size={15} />
              <span>Dashboard</span>

          )}

          {canViewAdmin && (
            <button
              onClick={() => setActiveTab('admin')}
              className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                activeTab === 'admin'
                  ? 'bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-sm'

          {/* Quick A4 Report Button */}
          <button
            onClick={onOpenAuditModal}
            className="hidden lg:flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 transition"
            title="Generate Official Print-Ready Compliance Audit Certificate"
          >
            <Icon name="printer" size={14} className="text-indigo-600 dark:text-indigo-400" />
            <span>Audit Report</span>
          </button>

          {/* Theme Toggle */}
          <button
            onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
            className="p-2 rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 transition"
            title={theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'}
          >
            <Icon name={theme === 'dark' ? 'sun' : 'moon'} size={15} />
          </button>

          {/* User Profile Pill */}
          <div className="flex items-center gap-2 pl-2 border-l border-slate-200 dark:border-slate-800">
            <button
              onClick={onOpenPasswordModal}
              className="text-left group flex items-center gap-2 py-1 px-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition"
              title="Click to change password"
            >
              <div className="w-8 h-8 rounded-xl bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-700 dark:text-slate-200 group-hover:bg-indigo-600 group-hover:text-white transition">
                {currentUser.name.charAt(0)}
              </div>
              <div className="hidden sm:block">
                <div className="text-xs font-bold text-slate-900 dark:text-white leading-tight">
                  {currentUser.name.split(' ')[0]}
                </div>
                <div className="text-[10px] text-slate-400 leading-tight">
                  {currentUser.role}
                </div>
              </div>
            </button>

            {/* Sign Out */}
            <button
              onClick={onSignOut}
              className="p-2 text-slate-400 hover:text-red-600 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition"
              title="Sign Out"
            >
              <Icon name="log-out" size={15} />
            </button>
          </div>
        </div>

      </div>
    </header>
  );
}

function ToastContainer({ toasts, onCloseToast }) {
  if (!toasts || toasts.length === 0) return null;
  return (
    <div className="fixed bottom-5 right-5 z-[100] flex flex-col gap-2 max-w-sm pointer-events-none no-print">
      {toasts.map(t => (
        <div
          key={t.id}
          className={`pointer-events-auto px-4 py-3 rounded-xl shadow-2xl border flex items-center gap-2.5 text-xs font-semibold animate-in fade-in slide-in-from-bottom-2 duration-200 ${
            t.type === 'success'
              ? 'bg-emerald-600 text-white border-emerald-500'
              : t.type === 'error'
              ? 'bg-rose-600 text-white border-rose-500'
              : t.type === 'warning'
              ? 'bg-amber-600 text-white border-amber-500'
              : 'bg-slate-900 text-white dark:bg-slate-800 border-slate-700'
          }`}
        >
          <Icon
            name={t.type === 'success' ? 'check-circle' : t.type === 'error' ? 'alert-triangle' : t.type === 'warning' ? 'alert-circle' : 'help-circle'}
            size={16}
          />
          <span className="flex-1 leading-snug">{t.message}</span>
          <button
            type="button"
            onClick={() => onCloseToast(t.id)}
            className="opacity-70 hover:opacity-100 p-0.5 rounded transition"
          >
            <Icon name="x" size={13} />
          </button>
        </div>
      ))}
    </div>
  );
}

function ConfirmModal({ isOpen, title, message, confirmText = "Confirm", cancelText = "Cancel", type = "danger", onConfirm, onClose }) {
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === "Escape") onClose();
    };
    if (isOpen) {
      window.addEventListener("keydown", handleKeyDown);
      return () => window.removeEventListener("keydown", handleKeyDown);
    }
  }, [isOpen, onClose]);

  if (!isOpen) return null;

  return (
    <div className="fixed inset-0 z-[90] bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
      <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4 animate-in fade-in zoom-in-95 duration-150">
        <div className="flex items-center gap-3">
          <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-white shrink-0 ${
            type === 'danger' ? 'bg-rose-600' : type === 'warning' ? 'bg-amber-600' : 'bg-indigo-600'
          }`}>
            <Icon name={type === 'danger' ? 'alert-triangle' : type === 'warning' ? 'alert-circle' : 'help-circle'} size={20} />
          </div>
          <div>
            <h3 className="text-sm font-bold text-slate-900 dark:text-white">{title}</h3>
            <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{message}</p>
          </div>
        </div>

        <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
          <button
            type="button"
            onClick={onClose}
            className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
          >
            {cancelText}
          </button>
          <button
            type="button"
            onClick={onConfirm}
            className={`px-4 py-2 rounded-xl text-xs font-semibold text-white shadow-sm transition ${
              type === 'danger'
                ? 'bg-rose-600 hover:bg-rose-700'
                : type === 'warning'
                ? 'bg-amber-600 hover:bg-amber-700'
                : 'bg-indigo-600 hover:bg-indigo-700'
            }`}
          >
            {confirmText}
          </button>
        </div>
      </div>
    </div>
  );
}

function ActivityHistoryModal({ activity, log, onClose }) {
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === "Escape") onClose();
    };
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [onClose]);

  if (!activity) return null;
  const history = log?.history || [];

  const getActionBadge = (action) => {
    switch (action) {
      case 'PERFORMED':
        return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-800 dark:bg-blue-950/60 dark:text-blue-300 border border-blue-300 dark:border-blue-800">Performed</span>;
      case 'PERFORM_CLEARED':
        return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400">Date Cleared</span>;
      case 'VERIFIED':
        return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800">Verified</span>;
      case 'VERIFICATION_REVOKED':
        return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800 dark:bg-rose-950/60 dark:text-rose-300 border border-rose-300 dark:border-rose-800">Revoked</span>;
      case 'MARKED_NA':
        return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-purple-100 text-purple-800 dark:bg-purple-950/60 dark:text-purple-300">Marked N/A</span>;
      case 'MARKED_APPLICABLE':
        return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-100 text-indigo-800 dark:bg-indigo-950/60 dark:text-indigo-300">Applicable</span>;
      case 'QUERY_RAISED':
        return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300">Query Raised</span>;
      case 'QUERY_RESOLVED':
        return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-teal-100 text-teal-800 dark:bg-teal-950/60 dark:text-teal-300">Query Resolved</span>;
      default:
        return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300">{action}</span>;
    }
  };

  return (
    <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
      <div className="w-full max-w-2xl max-h-[85vh] flex flex-col bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 animate-in fade-in zoom-in-95 duration-150">
        
        {/* Header */}
        <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center border border-indigo-200 dark:border-indigo-800 shrink-0">
              <Icon name="clock" size={16} />
            </div>
            <div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold text-slate-900 dark:text-white">Activity Audit Trail</span>
                <span className="px-1.5 py-0.2 rounded text-[10px] font-mono font-bold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300">#{activity.srNo}</span>
              </div>
              <p className="text-[11px] text-slate-500 truncate max-w-md">{activity.name}</p>
            </div>
          </div>
          <button
            onClick={onClose}
            className="p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition"
          >
            <Icon name="x" size={16} />
          </button>
        </div>

        {/* Content */}
        <div className="flex-1 overflow-y-auto p-4 space-y-3">
          <div className="bg-slate-50 dark:bg-slate-800/50 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2 text-xs">
            <div><span className="text-slate-400">Phase:</span> <span className="font-semibold text-slate-700 dark:text-slate-200">{activity.phase}</span></div>
            <div><span className="text-slate-400">Maker Role:</span> <span className="font-semibold text-indigo-600 dark:text-indigo-400">{activity.performedBy}</span></div>
            <div><span className="text-slate-400">Total Audit Logs:</span> <span className="font-bold text-slate-900 dark:text-white">{history.length}</span></div>
          </div>

          {history.length === 0 ? (
            <div className="py-12 text-center text-slate-400 text-xs">
              <Icon name="clock" size={28} className="mx-auto mb-2 opacity-30" />
              <p>No audit history entries recorded for this activity yet.</p>
              <p className="text-[10px] text-slate-500 mt-1">Actions like Performed, Verified, Revoked, and Queries will automatically appear here.</p>
            </div>
          ) : (
            <div className="relative pl-6 space-y-4 before:absolute before:left-2.5 before:top-2 before:bottom-2 before:w-0.5 before:bg-slate-200 dark:before:bg-slate-800">
              {history.slice().reverse().map((entry, idx) => (
                <div key={entry.id || idx} className="relative text-xs">
                  <span className="absolute -left-6 top-1 w-2.5 h-2.5 rounded-full bg-indigo-600 border-2 border-white dark:border-slate-900" />
                  <div className="bg-white dark:bg-slate-800/80 p-3 rounded-xl border border-slate-200 dark:border-slate-700/60 shadow-xs space-y-1">
                    <div className="flex items-center justify-between gap-2">
                      <div className="flex items-center gap-2">
                        {getActionBadge(entry.action)}
                        <span className="font-bold text-slate-900 dark:text-white">{entry.userName}</span>
                        <span className="text-[10px] px-1 rounded bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300 font-mono">{entry.role}</span>
                      </div>
                      <span className="text-[10px] text-slate-400">
                        {new Date(entry.timestamp).toLocaleString()}
                      </span>
                    </div>
                    {entry.dateValue && (
                      <div className="text-[11px] text-slate-600 dark:text-slate-300">
                        <span className="text-slate-400">Date recorded:</span> <strong className="font-mono">{formatDateDisplay(entry.dateValue)}</strong>
                      </div>
                    )}
                    {entry.details && (
                      <div className="text-[11px] text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-900/60 p-2 rounded-lg border border-slate-100 dark:border-slate-800/50">
                        {entry.details}
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Footer */}
        <div className="p-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
          <button
            onClick={onClose}
            className="px-4 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition"
          >
            Close
          </button>
        </div>
      </div>
    </div>
  );
}

// --- Context Selector Bar ---
function ContextBar({
  currentUser,
  config,
  context,
  setContext
}) {
  // Allowed colleges
  const allowedColleges = useMemo(() => {
    if (currentUser.isAdmin || ['COE', 'DY_COE'].includes(currentUser.role) || currentUser.assignedColleges?.includes('ALL')) {
      return config.colleges;
    }
    return config.colleges.filter(c => (currentUser.assignedColleges || []).includes(c.id));
  }, [currentUser, config.colleges]);

  // Helper to determine allowed programs for any college
  const getAllowedProgramsForCollege = (colId) => {
    const allProgs = config.programs[colId] || [];
    if (currentUser.isAdmin || ['COE', 'DY_COE'].includes(currentUser.role) || currentUser.assignedColleges?.includes('ALL')) {
      return allProgs;
    }
    const userCollegeProgs = currentUser.assignedPrograms?.[colId];
    if (!userCollegeProgs || userCollegeProgs.includes('ALL')) {
      return allProgs;
    }
    return allProgs.filter(p => userCollegeProgs.includes(p));
  };

  // Allowed programs for selected college
  const allowedPrograms = useMemo(() => {
    return getAllowedProgramsForCollege(context.college);
  }, [currentUser, config.programs, context.college]);

  const handleCollegeChange = (colId) => {
    const allowed = getAllowedProgramsForCollege(colId);
    const firstProg = allowed[0] || (config.programs[colId]?.[0] || "");
    setContext(prev => ({
      ...prev,
      college: colId,
      program: firstProg
    }));
  };

  return (
    <div className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm py-2 px-4 no-print">
      <div className="max-w-[1700px] mx-auto flex flex-wrap items-center justify-between gap-3 text-xs">
        
        {/* Selectors */}
        <div className="flex flex-wrap items-center gap-2 sm:gap-3">
          {/* College */}
          <div className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800/60 px-2.5 py-1 rounded-xl border border-slate-200 dark:border-slate-700">
            <Icon name="building" size={14} className="text-indigo-600 dark:text-indigo-400" />
            <span className="font-semibold text-slate-500">College:</span>
            <select
              value={context.college}
              onChange={(e) => handleCollegeChange(e.target.value)}
              className="bg-transparent font-bold text-slate-900 dark:text-white focus:outline-none cursor-pointer"
            >
              {allowedColleges.map(c => (
                <option key={c.id} value={c.id} className="dark:bg-slate-900 text-slate-900 dark:text-white">
                  {c.name}
                </option>
              ))}
            </select>
          </div>

          {/* Batch */}
          <div className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800/60 px-2.5 py-1 rounded-xl border border-slate-200 dark:border-slate-700">
            <Icon name="calendar" size={14} className="text-indigo-600 dark:text-indigo-400" />
            <span className="font-semibold text-slate-500">Batch:</span>
            <select
              value={context.batch}
              onChange={(e) => setContext(prev => ({ ...prev, batch: e.target.value }))}
              className="bg-transparent font-bold text-slate-900 dark:text-white focus:outline-none cursor-pointer"
            >
              {config.batches.map(b => (
                <option key={b} value={b} className="dark:bg-slate-900 text-slate-900 dark:text-white">
                  {b}
                </option>
              ))}
            </select>
          </div>

          {/* Program */}
          <div className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800/60 px-2.5 py-1 rounded-xl border border-slate-200 dark:border-slate-700">
            <Icon name="book-open" size={14} className="text-indigo-600 dark:text-indigo-400" />
            <span className="font-semibold text-slate-500">Program:</span>
            <select
              value={context.program}
              onChange={(e) => setContext(prev => ({ ...prev, program: e.target.value }))}
              className="bg-transparent font-bold text-slate-900 dark:text-white focus:outline-none cursor-pointer max-w-[180px] truncate"
            >
              {allowedPrograms.map(p => (
                <option key={p} value={p} className="dark:bg-slate-900 text-slate-900 dark:text-white">
                  {p}
                </option>
              ))}
            </select>
          </div>

          {/* Semester */}
          <div className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800/60 px-2.5 py-1 rounded-xl border border-slate-200 dark:border-slate-700">
            <span className="font-semibold text-slate-500">Sem:</span>
            <select
              value={context.semester}
              onChange={(e) => setContext(prev => ({ ...prev, semester: e.target.value }))}
              className="bg-transparent font-bold text-slate-900 dark:text-white focus:outline-none cursor-pointer"
            >
              {config.semesters.map(s => (
                <option key={s} value={s} className="dark:bg-slate-900 text-slate-900 dark:text-white">
                  {s}
                </option>
              ))}
            </select>
          </div>

          {/* Exam Cycle */}
          <div className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800/60 px-2.5 py-1 rounded-xl border border-slate-200 dark:border-slate-700">
            <span className="font-semibold text-slate-500">Cycle:</span>
            <select
              value={context.examCycle}
              onChange={(e) => setContext(prev => ({ ...prev, examCycle: e.target.value }))}
              className="bg-transparent font-bold text-slate-900 dark:text-white focus:outline-none cursor-pointer"
            >
              {config.examCycles.map(ec => (
                <option key={ec} value={ec} className="dark:bg-slate-900 text-slate-900 dark:text-white">
                  {ec}
                </option>
              ))}
            </select>
          </div>
        </div>

        {/* Current Active Context Badge */}
        <div className="hidden lg:flex items-center gap-2">
          <span className="px-2.5 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 font-mono text-[11px] font-semibold border border-indigo-200 dark:border-indigo-800">
            {context.college} · {context.batch} · {context.program} · {context.semester} · {context.examCycle}
          </span>
        </div>
      </div>
    </div>
  );
}

// --- Section A: Session Summary Cards (8-Card Responsive Grid) ---
function HeaderMetricsCards({
  metrics = {},
  onUpdateMetrics,
  context = {},
  currentLogs = {}
}) {
  const handleChange = (field, val) => {
    const num = parseInt(val, 10);
    onUpdateMetrics({
      ...metrics,
      [field]: isNaN(num) ? 0 : num
    });
  };

  // Auto-derived Exam Month & Year from Exam Start Date
  const autoDerivedMonthYear = useMemo(() => {
    const isReExam = context?.examCycle === "Re-Exam";
    let targetDate = "";
    if (isReExam) {
      targetDate = currentLogs?.["act_135"]?.performedDate || currentLogs?.["act_23"]?.performedDate || "";
    } else {
      targetDate = currentLogs?.["act_23"]?.performedDate || currentLogs?.["act_135"]?.performedDate || "";
    }
    return formatExamMonthYear(targetDate);
  }, [context?.examCycle, currentLogs]);

  const displayMonthYear = metrics.examMonthYear ?? autoDerivedMonthYear ?? "";
  const isAutoSynced = autoDerivedMonthYear && (metrics.examMonthYear === autoDerivedMonthYear || !metrics.examMonthYear);

  return (
    <div className="my-3 no-print">
      <div className="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-8 gap-2.5">
        
        {/* 1: BATCH */}
        <div className="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between">
          <div className="text-[10px] font-bold tracking-wider text-slate-500 uppercase flex items-center justify-between">
            <span>BATCH</span>
            <Icon name="calendar" size={13} className="text-slate-400" />
          </div>
          <div className="text-base font-bold text-slate-900 dark:text-white mt-1">
            {metrics.batch || context.batch || "2025-26"}
          </div>
          <div className="text-[10px] text-slate-400">Academic Year</div>
        </div>

        {/* 2: EXAM MONTH & YEAR (Auto + Manual Edit) */}
        <div className="bg-indigo-50/70 dark:bg-indigo-950/30 p-2.5 rounded-xl border border-indigo-200 dark:border-indigo-900/60 shadow-sm flex flex-col justify-between">
          <div className="text-[10px] font-bold tracking-wider text-indigo-700 dark:text-indigo-300 uppercase flex items-center justify-between">
            <span>EXAM MONTH & YEAR</span>
            <Icon name="clock" size={13} className="text-indigo-500" />
          </div>
          <div className="mt-1">
            <input
              type="text"
              value={displayMonthYear}
              onChange={(e) => onUpdateMetrics({ ...metrics, examMonthYear: e.target.value })}
              placeholder="e.g. October, 2026"
              className="w-full px-1.5 py-0.5 text-xs font-bold text-indigo-950 dark:text-indigo-200 bg-white dark:bg-slate-900 rounded border border-indigo-300 dark:border-indigo-800 focus:outline-none focus:ring-1 focus:ring-indigo-500 truncate"
              title="Exam Month & Year (Derived automatically from Exam Start Date or edited manually)"
            />
          </div>
          <div className="text-[10px] text-indigo-600 dark:text-indigo-400 truncate">
            {isAutoSynced ? "Auto from Start Date" : displayMonthYear ? "Manual / Session" : "Set Start Date or Type"}
          </div>
        </div>

        {/* 3: PROGRAMS */}
        <div className="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between">
          <div className="text-[10px] font-bold tracking-wider text-slate-500 uppercase flex items-center justify-between">
            <span>PROGRAMS</span>
            <Icon name="book-open" size={13} className="text-slate-400" />
          </div>
          <div className="mt-1 flex items-center gap-1">
            <input
              type="number"
              min="1"
              value={metrics.numPrograms ?? 1}
              onChange={(e) => handleChange('numPrograms', e.target.value)}
              className="w-16 px-1.5 py-0.5 text-base font-bold text-slate-900 dark:text-white bg-slate-50 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500"
            />
          </div>
          <div className="text-[10px] text-slate-400">Under this Session</div>
        </div>

        {/* 4: MODULES */}
        <div className="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between">
          <div className="text-[10px] font-bold tracking-wider text-slate-500 uppercase flex items-center justify-between">
            <span>MODULES</span>
            <Icon name="layers" size={13} className="text-slate-400" />
          </div>
          <div className="mt-1 flex items-center gap-1">
            <input
              type="number"
              min="0"
              value={metrics.numModules ?? 6}
              onChange={(e) => handleChange('numModules', e.target.value)}
              className="w-16 px-1.5 py-0.5 text-base font-bold text-slate-900 dark:text-white bg-slate-50 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500"
            />
            <span className="text-xs font-semibold text-slate-400">WRIT</span>
          </div>
          <div className="text-[10px] text-slate-400">Active Papers</div>
        </div>

        {/* 5: STUDENTS */}
        <div className="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col justify-between">
          <div className="text-[10px] font-bold tracking-wider text-slate-500 uppercase flex items-center justify-between">
            <span>STUDENTS</span>
            <Icon name="users" size={13} className="text-slate-400" />
          </div>
          <div className="mt-1">
            <input
              type="number"
              min="0"
              value={metrics.totalStudents ?? 480}
              onChange={(e) => handleChange('totalStudents', e.target.value)}
              className="w-20 px-1.5 py-0.5 text-base font-bold text-slate-900 dark:text-white bg-slate-50 dark:bg-slate-800 rounded border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500"
            />
          </div>
          <div className="text-[10px] text-slate-400">Registered Count</div>
        </div>

        {/* 6: PWD */}
        <div className="bg-purple-50/70 dark:bg-purple-950/30 p-2.5 rounded-xl border border-purple-200 dark:border-purple-900/60 shadow-sm flex flex-col justify-between">
          <div className="text-[10px] font-bold tracking-wider text-purple-700 dark:text-purple-300 uppercase flex items-center justify-between">
            <span>PWD</span>
            <span className="w-2 h-2 rounded-full bg-purple-500" />
          </div>
          <div className="mt-1">
            <input
              type="number"
              min="0"
              value={metrics.pwdStudents ?? 0}
              onChange={(e) => handleChange('pwdStudents', e.target.value)}
              className="w-16 px-1.5 py-0.5 text-base font-bold text-purple-900 dark:text-purple-200 bg-white dark:bg-slate-900 rounded border border-purple-300 dark:border-purple-800 focus:outline-none focus:ring-1 focus:ring-purple-500"
            />
          </div>
          <div className="text-[10px] text-purple-600 dark:text-purple-400">Comp. Time / Writer</div>
        </div>

        {/* 7: DEBARRED */}
        <div className="bg-rose-50/70 dark:bg-rose-950/30 p-2.5 rounded-xl border border-rose-200 dark:border-rose-900/60 shadow-sm flex flex-col justify-between">
          <div className="text-[10px] font-bold tracking-wider text-rose-700 dark:text-rose-300 uppercase flex items-center justify-between">
            <span>DEBARRED</span>
            <span className="w-2 h-2 rounded-full bg-rose-500" />
          </div>
          <div className="mt-1">
            <input
              type="number"
              min="0"
              value={metrics.debarredStudents ?? 0}
              onChange={(e) => handleChange('debarredStudents', e.target.value)}
              className="w-16 px-1.5 py-0.5 text-base font-bold text-rose-900 dark:text-rose-200 bg-white dark:bg-slate-900 rounded border border-rose-300 dark:border-rose-800 focus:outline-none focus:ring-1 focus:ring-rose-500"
            />
          </div>
          <div className="text-[10px] text-rose-600 dark:text-rose-400">Attendance Defaulters</div>
        </div>

        {/* 8: UFM PENDING */}
        <div className="bg-amber-50/70 dark:bg-amber-950/30 p-2.5 rounded-xl border border-amber-200 dark:border-amber-900/60 shadow-sm flex flex-col justify-between">
          <div className="text-[10px] font-bold tracking-wider text-amber-700 dark:text-amber-300 uppercase flex items-center justify-between">
            <span>UFM PENDING</span>
            <span className="w-2 h-2 rounded-full bg-amber-500" />
          </div>
          <div className="mt-1">
            <input
              type="number"
              min="0"
              value={metrics.ufmCases ?? 0}
              onChange={(e) => handleChange('ufmCases', e.target.value)}
              className="w-16 px-1.5 py-0.5 text-base font-bold text-amber-900 dark:text-amber-200 bg-white dark:bg-slate-900 rounded border border-amber-300 dark:border-amber-800 focus:outline-none focus:ring-1 focus:ring-amber-500"
            />
          </div>
          <div className="text-[10px] text-amber-600 dark:text-amber-400">UMIC Action Pending</div>
        </div>

      </div>
    </div>
  );
}

function ActivityTrackerView({
  activities,
  currentLogs,
  context,
  currentUser,
  headerMetrics,
  config,
  onUpdateLog,
  onBulkUpdateLogs,
  onRevokeVerification,
  onOpenQueryModal,
  phaseFilter = "ALL",
  setPhaseFilter,
  showConfirm,
  showToast
}) {
  const [historyModalAct, setHistoryModalAct] = useState(null);
  const [statusFilter, setStatusFilter] = useState("ALL");
  const [makerFilter, setMakerFilter] = useState("ALL");
  const [searchQuery, setSearchQuery] = useState("");
  const [collapsedPhases, setCollapsedPhases] = useState({});
  const [selectedIds, setSelectedIds] = useState([]);

  // Group activities by phase (respects config.phases order with fallback)
  const phases = useMemo(() => {
    const list = config?.phases && config.phases.length > 0 ? [...config.phases] : [...INITIAL_PHASES];
    activities.forEach(a => {
      if (a.phase && !list.includes(a.phase)) list.push(a.phase);
    });
    return list;
  }, [activities, config?.phases]);

  // Filter activities
  const filteredActivities = useMemo(() => {
    return activities.filter(act => {
      const log = currentLogs[act.id] || {};
      const status = computeActivityStatus(act, log, context.semester);

      // Phase
      if (phaseFilter !== "ALL" && act.phase !== phaseFilter) return false;

      // Maker
      if (makerFilter !== "ALL" && act.performedBy !== makerFilter) return false;

      // Status
      if (statusFilter !== "ALL") {
        if (statusFilter === "AWAITING_ME") {
          // Can I perform?
          const canPerform = act.performedBy === currentUser.role && !log.performedDate && !log.isNA;
          // Can I verify?
          let canVerify = false;
          const reqs = (act.requiredVerifiers || []).filter(r => (ROLE_RANKS[r] ?? -1) > (ROLE_RANKS[act.performedBy] ?? -1));
          if (log.performedDate && !log.isNA && reqs.includes(currentUser.role)) {
            const idx = reqs.indexOf(currentUser.role);
            const prevDone = idx === 0 || !!log.verifications?.[reqs[idx - 1]]?.verified;
            canVerify = prevDone && !log.verifications?.[currentUser.role]?.verified;
          }
          if (!canPerform && !canVerify) return false;
        } else if (statusFilter === "PENDING" && status !== "PENDING") {
          return false;
        } else if (statusFilter === "IN_PROGRESS" && status !== "IN_PROGRESS") {
          return false;
        } else if (statusFilter === "COMPLETED" && status !== "COMPLETED") {
          return false;
        } else if (statusFilter === "QUERY_RAISED" && status !== "QUERY_RAISED") {
          return false;
        } else if (statusFilter === "NA" && status !== "NA") {
          return false;
        }
      }

      // Search
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase().trim();
        const matchesName = act.name.toLowerCase().includes(q);
        const matchesSr = String(act.srNo).includes(q);
        if (!matchesName && !matchesSr) return false;
      }

      return true;
    });
  }, [activities, currentLogs, context.semester, phaseFilter, statusFilter, makerFilter, searchQuery, currentUser]);

  // Overall counters
  const stats = useMemo(() => {
    let completed = 0;
    let inProgress = 0;
    let pending = 0;
    let queryRaised = 0;
    let na = 0;

    activities.forEach(act => {
      const log = currentLogs[act.id] || {};
      const s = computeActivityStatus(act, log, context.semester);
      if (s === "COMPLETED") completed++;
      else if (s === "IN_PROGRESS") inProgress++;
      else if (s === "QUERY_RAISED") queryRaised++;
      else if (s === "NA" || s === "SKIPPED") na++;
      else pending++;
    });

    const activeTotal = activities.length - na;
    const pct = activeTotal > 0 ? Math.round((completed / activeTotal) * 100) : 0;
    return { completed, inProgress, pending, queryRaised, na, pct };
  }, [activities, currentLogs, context.semester]);

  // Toggle Collapse
  const togglePhase = (phase) => {
    setCollapsedPhases(prev => ({ ...prev, [phase]: !prev[phase] }));
  };

  const expandAll = () => setCollapsedPhases({});
  const collapseAll = () => {
    const all = {};
    phases.forEach(p => all[p] = true);
    setCollapsedPhases(all);
  };

  // Selection handlers
  const handleSelectAllVisible = (e) => {
    if (e.target.checked) {
      setSelectedIds(filteredActivities.map(a => a.id));
    } else {
      setSelectedIds([]);
    }
  };

  const toggleSelectRow = (id) => {
    setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  };

  // Bulk actions
  const handleBulkSetPerformed = () => {
    const today = getTodayYYYYMMDD();
    const updates = {};
    selectedIds.forEach(id => {
      const act = activities.find(a => a.id === id);
      if (!act) return;
      // Maker or admin check
      if (currentUser.isAdmin || currentUser.role === act.performedBy) {
        const cur = currentLogs[id] || {};
        const hist = {
          id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          action: "PERFORMED",
          role: currentUser.role,
          userName: currentUser.name,
          userEmail: currentUser.email,
          dateValue: cur.performedDate || today,
          details: "Bulk marked as performed",
          timestamp: new Date().toISOString()
        };
        updates[id] = {
          ...cur,
          performedDate: cur.performedDate || today,
          performedByUser: cur.performedByUser || {
            name: currentUser.name,
            email: currentUser.email,
            timestamp: new Date().toISOString()
          },
          history: [...(cur.history || []), hist]
        };
      }
    });
    onBulkUpdateLogs(updates);
    setSelectedIds([]);
  };

  const handleBulkVerify = () => {
    const today = getTodayYYYYMMDD();
    const role = currentUser.role;
    const updates = {};

    selectedIds.forEach(id => {
      const act = activities.find(a => a.id === id);
      if (!act) return;
      const log = currentLogs[id] || {};
      const reqs = (act.requiredVerifiers || []).filter(r => (ROLE_RANKS[r] ?? -1) > (ROLE_RANKS[act.performedBy] ?? -1));
      if (!reqs.includes(role)) return;

      const idx = reqs.indexOf(role);
      const prevDone = idx === 0 || !!log.verifications?.[reqs[idx - 1]]?.verified;
      if (log.performedDate && prevDone && !log.verifications?.[role]?.verified) {
        const hist = {
          id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          action: "VERIFIED",
          role: currentUser.role,
          userName: currentUser.name,
          userEmail: currentUser.email,
          dateValue: today,
          details: `Bulk signed off tier ${role}`,
          timestamp: new Date().toISOString()
        };
        updates[id] = {
          ...log,
          verifications: {
            ...(log.verifications || {}),
            [role]: {
              verified: true,
              date: today,
              userName: currentUser.name,
              userEmail: currentUser.email,
              systemTimestamp: new Date().toISOString()
            }
          },
          history: [...(log.history || []), hist]
        };
      }
    });

    onBulkUpdateLogs(updates);
    setSelectedIds([]);
  };

  const handleBulkToggleNA = (isNA) => {
    const updates = {};
    const nowIso = new Date().toISOString();
    selectedIds.forEach(id => {
      const cur = currentLogs[id] || {};
      const hist = {
        id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        action: isNA ? "MARKED_NA" : "MARKED_APPLICABLE",
        role: currentUser.role,
        userName: currentUser.name,
        userEmail: currentUser.email,
        dateValue: null,
        details: isNA ? "Marked as N/A in bulk" : "Marked as Applicable in bulk",
        timestamp: nowIso
      };
      updates[id] = {
        ...cur,
        isNA,
        history: [...(cur.history || []), hist]
      };
    });
    onBulkUpdateLogs(updates);
    setSelectedIds([]);
  };

  // Maker single field changes
  const handleSetPerformedDate = (act, dateVal) => {
    const cur = currentLogs[act.id] || {};
    const hist = {
      id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),
      action: dateVal ? "PERFORMED" : "PERFORM_CLEARED",
      role: currentUser.role,
      userName: currentUser.name,
